[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workstation-living-system"
version = "1.0.0"
description = "A bounded functional software-life runtime for persistent observation, learning, memory, skills, and governed action."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sangzi Wang"}]
dependencies = []
keywords = ["agent", "memory", "world-model", "continual-learning", "workstation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.scripts]
wls = "wls.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
