frozen_decisions:
  - "Safe-default installation remains read-only."
  - "External providers and plugins remain opt-in."
  - "Writes remain sandboxed and governed."
  - "No automatic Windows service, scheduled task, publication, deletion, or broad Workstation integration."
  - "Provider output remains subject to deterministic schema, policy, and tool gates."
  - "Human authorization remains mandatory for skill approval and promotion."
  - "Claims remain limited to observable software functions."

active_evolution_target:
  id: "EVOLUTION-TARGET-001"
  title: "Verified failure-to-skill-to-reuse loop"
  status: "SCOPED"
  objective: >-
    Demonstrate one complete, auditable growth cycle from a reproducible failure
    through skill proposal, isolated validation, human approval, promotion, later
    real-task reuse, post-promotion measurement, and rollback readiness.
  acceptance_conditions:
    - "A failure is reproduced or explicitly marked NON_REPRODUCIBLE."
    - "The original failure and evidence are durably retained."
    - "A versioned skill candidate is linked to the failure."
    - "Sandbox boundaries and fixtures are recorded."
    - "A frozen baseline is measured before candidate validation."
    - "Acceptance thresholds are defined before evaluation."
    - "Targeted and affected regression tests pass."
    - "Approval and promotion are explicitly authorized by the owner."
    - "The promoted skill is reused on a later real task."
    - "Post-promotion benefit and regressions are measured."
    - "A tested rollback path exists."
  claim_boundary: >-
    Until all acceptance conditions are evidenced, WLS may claim a governed skill
    lifecycle implementation but not verified self-improvement or self-evolution.

