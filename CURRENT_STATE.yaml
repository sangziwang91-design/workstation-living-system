    role: "current default branch before fast-forward"
    status: "VERIFIED_BASE"
  - name: "evolution-target-001-canonical"
    role: "verified canonical implementation candidate"
    status: "READY_FOR_FAST_FORWARD"

current_limitations:
  - "The approval identities in automated verification are explicit test fixtures, not the owner's production approval."
  - "The later tasks execute through the real runtime path but inside temporary isolated homes."
  - "The GitHub Actions pass is evidenced by bot commits after gated steps; a separate check-run status was not returned by the connector."
  - "Capabilities outside the growth lifecycle were not comprehensively re-audited in this wave."

unique_next_action: >-
  Fast-forward the verified branch to main, then execute one genuine owner-authorized
  EVOLUTION-TARGET-001 run on the intended Windows workstation and persist its retain
  or rollback evidence without adding another runtime.

stop_conditions:
  - "Stop if the host run would bypass human approval, policy gates, evidence retention, or rollback."
  - "Stop if main advances independently and cannot be reconciled by fast-forward."
  - "Stop after host evidence is persisted; do not create a parallel subsystem."

prohibited_misinterpretations:
  - "CI verification is not proof of long-term external effectiveness."
  - "A sandbox pass is not promotion."
  - "A test-fixture approval is not the owner's production authorization."
  - "A retained skill in an isolated run is not proof of indefinite self-improvement."
  - "Persistent state is not subjective consciousness."
  - "Functional affect is not genuine emotion."
