frozen_decisions:
  - "Safe-default installation remains read-only."
  - "External providers and plugins remain opt-in."
  - "Writes remain sandboxed and governed."
  - "No automatic publication, deletion, unrestricted shell, self-replication, or broad Workstation integration."
  - "Provider output remains subject to deterministic schema, policy, and tool gates."
  - "Human authorization remains mandatory for approval, promotion, and rollback."
  - "Claims remain limited to observable software functions."
  - "No parallel v2/final/brain runtime may replace the canonical LivingSystem without an approved migration."

completed_evolution_targets:
  - id: "EVOLUTION-TARGET-001"
    title: "Verified failure-to-skill-to-reuse loop"
    status: "MERGED_CI_VERIFIED_HOST_PROOF_PENDING"
    pull_request: 3
    merge_commit: "37b0fd55987e9d61a08a4934ed7807871a9d3b76"
    verified_behaviors:
      - "Repeated action failures create durable evidence-linked candidates."
      - "Recovery experiments use a frozen baseline and predetermined thresholds."
      - "Versioned skill proposals require isolated validation and reject fabricated evidence."
      - "Approval, promotion, and rollback retain explicit human gates."
      - "Promoted skills are reused through the canonical runtime."
      - "Post-promotion outcomes produce RETAIN or ROLLBACK_REQUIRED decisions."
      - "A degraded promoted skill is removed from active and matching sets by tested rollback."
    remaining_proof:
      - "One genuine owner-authorized failure and later-task reuse on the intended production host."
      - "Longitudinal evidence that retained skills improve external outcomes."

  - id: "EVOLUTION-TARGET-002"
    title: "Bounded local cognition vertical slice"
    status: "MERGED_CI_VERIFIED"
    pull_request: 6
    verified_head: "8fb962204e4a41a2fa764b94479168434522e856"
    merge_commit: "3fb94c030089543c99ea532e606da7d9cd84b689"
    verified_behaviors:
      - "Structured observations produce competing durable hypotheses."
      - "The selected hypothesis and alternatives retain evidence identifiers."
      - "The cognitive trace records a memory-free counterfactual."
      - "Actions create predictions that are resolved from governed outcomes."
      - "Observed outcomes update the temporal causal world model."
      - "Cognitive traces and calibration survive restart."
      - "External provider failure falls back to local cognition with durable evidence."

  - id: "EVOLUTION-TARGET-003"
    title: "Causal Memory Retrieval and Measurable Learning Advantage"
    status: "IMPLEMENTED_LOCAL_AND_CI_VERIFIED_HOST_LONGITUDINAL_PENDING"
    pull_request: 7
    verified_head: "a2a9b23cd95f70259be92146966cbfddc7fe76ba"
    implementation_head: "f134622018a8200e9985f92b792b5493a372e43c"
    objective: >-
      Make existing memories enter bounded decisions through evidence-linked causal,
      temporal, entity, failure-mechanism, applicability, validity, and refutation
      context, then compare the result with a frozen memory-disabled baseline.
    completed_acceptance_conditions:
      - "Entity-linked and failure-mechanism retrieval are covered by tests."
      - "An attributable memory changes the selected hypothesis and action."
      - "The memory-free counterfactual is persisted and differs when memory changes the decision."
      - "The memory-enabled arm outperforms the memory-disabled arm on the controlled task sequence."
      - "Repeated counterevidence changes ACTIVE to WEAKENED and then REFUTED."
      - "A refuted memory stops influencing decisions."
      - "Valid-memory advantage persists across restart."
      - "Refuted-memory suppression persists across restart."
      - "ET001 and ET002 remain green."
      - "Compile, tests, all target verifiers, ruff, mypy, bandit, and package build pass."
      - "Ubuntu and Windows pass under Python 3.11 and 3.13."
    claim_boundary: >-
      WLS has a locally and CI-verified causal-memory retrieval and memory-advantage
      evaluation mechanism. Controlled evidence shows attributable decision changes,
      improved outcomes against a frozen baseline, contradiction handling, and restart
      continuity. This is not production-host longitudinal proof.

  - id: "EVOLUTION-TARGET-004"
    title: "Persistent Goal System and Long-Horizon Continuity"
    status: "IMPLEMENTED_LOCAL_FULL_GATE_VERIFIED_REMOTE_CI_PENDING"
    pull_request: 8
    objective: >-
      Extend the existing GoalStore and canonical LivingSystem with durable lifecycle,
      bounded decomposition, debt, review, decision attribution, interruption recovery,
      restart continuity, and a frozen goal-disabled comparison.
    completed_acceptance_conditions:
      - "Structured goal lifecycle and metadata persist across restart."
      - "Parent goals decompose into bounded dependency-ordered child tasks."
      - "Unrelated work creates explicit interruption debt and the same goal later resumes."
      - "Real action outcomes update child and parent progress with evidence."
      - "Goal-to-cognition attribution records a goal-free counterfactual and decision delta."
      - "The goal-enabled arm completes 4/4 tasks; the goal-disabled arm completes 0/4."
      - "ET001, ET002, and ET003 verifiers remain green locally."
      - "Nineteen tests, compile, ruff, mypy, bandit, and package build pass locally."
    remaining_proof:
      - "Ubuntu and Windows Python 3.11/3.13 GitHub Actions on the landed implementation head."
      - "Owner-host longitudinal goal persistence and measurable real-task advantage."
    claim_boundary: >-
      Controlled local evidence proves the implemented mechanism and comparison only;
      it does not prove production long-term autonomy, free will, AGI, consciousness,
      subjective emotion, or unrestricted self-rewrite.

