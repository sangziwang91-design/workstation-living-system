  - "The memory counterfactual proves behavior can change; it does not yet prove sustained performance advantage."
  - "Verification uses isolated temporary runtime homes, not the owner's production workstation."
  - "Capabilities outside cognition and the growth lifecycle were not comprehensively re-audited in this wave."

next_evolution_target:
  id: "EVOLUTION-TARGET-003"
  title: "Causal memory retrieval and measurable learning advantage"
  status: "SCOPED_NOT_IMPLEMENTED"
  objective: >-
    Replace broad lexical memory scanning with evidence-linked retrieval over project,
    entity, time, failure mechanism, causal context, validity, and applicability; then
    run frozen memory-enabled versus memory-disabled longitudinal tasks and retain the
    memory path only when it produces statistically and operationally meaningful benefit.
  acceptance_boundary: >-
    Mere retrieval relevance is insufficient. The target must show reproducible behavior
    differences, better task outcomes, no unacceptable regressions, contradiction-aware
    memory invalidation, and persistence across restart.

unique_next_action: >-
  Implement EVOLUTION-TARGET-003 inside the existing MemoryStore, CognitiveEngine,
  TemporalCausalWorld, and canonical LivingSystem without creating another memory system,
  planner identity, or parallel runtime.

stop_conditions:
  - "Stop if the next target would bypass evidence provenance, policy gates, human promotion authority, or rollback."
  - "Stop if memory-on superiority cannot be measured against a frozen memory-off baseline."
  - "Stop after one verified target is delivered; do not create a parallel subsystem."

prohibited_misinterpretations:
  - "Bounded hypothesis competition is not general intelligence."
  - "A confirmed prediction is not proof of a complete world model."
  - "Memory changing one decision is not proof of long-term learning advantage."
  - "CI verification is not production-host validation."
  - "Persistent state is not subjective consciousness."
  - "Functional affect is not genuine emotion."
