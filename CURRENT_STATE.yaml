  - "Stop if current repository state cannot be read or reconciled."
  - "Stop if another active change modifies the same files and produces an unresolved conflict."
  - "Stop after the unique target is delivered and evidenced; do not auto-create a new subsystem."

prohibited_misinterpretations:
  - "A documented capability is not automatically a verified runtime capability."
  - "A passing sandbox test is not promotion."
  - "A promoted skill without later reuse and measurement is not demonstrated growth."
  - "Persistent state is not subjective consciousness."
  - "Functional affect is not genuine emotion."
  - "Conversation continuity is not repository continuity."
