  - "Parallel v2 and decision runtime authority paths removed from the active implementation."
  - "Recovery experiment, skill validation, real reuse measurement, and rollback implemented in the canonical runtime."
  - "Fabricated machine-stage evidence is rejected."
  - "Local and GitHub Actions verification completed for isolated retain and rollback cases."
  - "Generated caches, build products, and package metadata removed from the tracked tree."

not_completed:
  - "Owner-authorized genuine-failure run on the intended Windows workstation."
  - "Long-duration autonomous operation and resource-stress validation."
  - "Broad connector-body integration with real Workstation systems."
  - "External longitudinal evidence that learning improves real outcomes."

active_branches:
