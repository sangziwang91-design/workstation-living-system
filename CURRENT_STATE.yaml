  owner_authority_preserved: true
  identity_continuity_contract_present: true
  parallel_runtime_authority_removed: true

current_capabilities:
  status: "CODE_AND_CI_VERIFIED_WITH_HOST_LIMIT"
  verified_in_this_wave:
    - "Canonical runtime remains source/src/wls/runtime.py::LivingSystem."
    - "Repeated failed actions can create evidence-linked failure candidates."
    - "Recovery candidates are compared with frozen baselines in isolated sandboxes."
    - "Skill proposals are versioned and linked to failure and recovery evidence."
    - "SANDBOXED and VALIDATED transitions reject fabricated evidence."
    - "Approval, promotion, and rollback retain explicit human gates."
    - "Promoted skills are reused through LivingSystem.run_cycle rather than a parallel executor."
    - "Post-promotion success, regressions, and RETAIN or ROLLBACK_REQUIRED decisions are persisted."
    - "A degraded promoted skill can be removed from active and matching sets through rollback."
  inherited_not_reverified_in_this_wave:
    - perception
    - world_model
    - internal_regulation
    - finite_workspace
    - multi_type_memory
    - sleep_and_consolidation
    - loopback_api

frozen_decisions:
  - "Safe-default installation remains read-only."
  - "External providers and plugins remain opt-in."
  - "Writes remain sandboxed and governed."
  - "No automatic Windows service, scheduled task, publication, deletion, or broad Workstation integration."
  - "Provider output remains subject to deterministic schema, policy, and tool gates."
  - "Human authorization remains mandatory for approval, promotion, and rollback."
  - "Claims remain limited to observable software functions."
  - "No parallel v2/final/brain runtime may replace the canonical LivingSystem without an approved migration."

active_evolution_target:
  id: "EVOLUTION-TARGET-001"
  title: "Verified failure-to-skill-to-reuse loop"
  status: "IMPLEMENTED_CI_VERIFIED_HOST_PROOF_PENDING"
  completed_acceptance_conditions:
    - "Failure records and source action identifiers are durably retained."
    - "Versioned skill candidates are linked to failure and recovery evidence."
    - "Sandbox roots, fixtures, manifests, and result digests are recorded."
    - "Frozen baseline measurements and acceptance thresholds precede evaluation."
    - "Targeted tests, affected regression tests, lint, type checks, security scan, and build pass."
    - "Approval, promotion, and rollback gates require explicit human approval parameters."
    - "A promoted skill is reused through a later canonical-runtime task in the verification harness."
    - "Post-promotion benefit and regressions are measured."
    - "A degradation scenario produces ROLLBACK_REQUIRED and passes rollback verification."
  remaining_acceptance_conditions:
    - "Run the lifecycle on the owner's intended Windows workstation using a genuine failure and non-synthetic later task."
    - "Record the owner's actual approval identity and authorization reference."
    - "Measure benefit, regressions, and retain-or-rollback outcome on that host."
  claim_boundary: >-
    WLS may claim an implemented and CI-verified bounded growth-cycle lifecycle.
    It may not yet claim long-term self-improvement, production readiness, unrestricted
    self-evolution, consciousness, or completion of the full software-life objective.

