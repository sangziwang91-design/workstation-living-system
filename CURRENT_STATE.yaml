active_iteration_candidate:
  id: "EVOLUTION-TARGET-002"
  title: "Bounded local cognition vertical slice"
  status: "IMPLEMENTED_PENDING_CI_AND_MERGE"
  objective: >-
    Integrate the existing temporal causal world model into the canonical LivingSystem,
    replace the default hard-coded reflex planner with durable local hypothesis
    competition, preserve memory-free counterfactuals, generate explicit predictions,
    and calibrate them from real tool outcomes without requiring an external model.
  claim_boundary: >-
