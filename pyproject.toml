[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workstation-living-system"
dynamic = ["version"]
description = "A bounded functional software-life runtime for persistent observation, learning, memory, skills, and governed action."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sangzi Wang"}]
dependencies = []
keywords = ["agent", "memory", "world-model", "continual-learning", "workstation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "build>=1.2"]

[project.scripts]
wls = "wls.cli:main"
wls-ui = "wls.ui_server:main"
wls-patch-missions = "wls.patch_mission_status_cli:main"

[tool.setuptools]
package-dir = {"" = "source/src"}

[tool.setuptools.packages.find]
where = ["source/src"]

[tool.setuptools.package-data]
"wls.ui_static" = ["*.html", "*.css", "*.js"]

[tool.setuptools.dynamic]
version = {attr = "wls._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["source/tests"]
addopts = "-q"
