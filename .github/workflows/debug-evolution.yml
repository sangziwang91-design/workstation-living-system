name: Evolution Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  evolution-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: python -m pip install -q -e . pytest
      - name: Focused evolution test
        run: python -m pytest -q tests/test_evolution_loop.py --tb=short
