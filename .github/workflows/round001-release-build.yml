name: round001-release-build

on:
  push:
    branches:
      - round/001-reproducible-baseline
    paths:
      - .github/workflows/round001-release-build.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round/001-reproducible-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source before packaging
        run: |
          python -m pip install -e './source[dev]'
          python -m pytest source/tests --cov=wls --cov-branch --cov-fail-under=65
          python -m ruff check source/src source/tests
          python -m mypy source/src
          python -m bandit -q -r source/src
      - name: Build one exact alpha wheel and patch installer selection
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.1.0a1
          rm -rf build-dist
          mkdir build-dist
          python -m build --wheel source --outdir build-dist
          test -f "build-dist/workstation_living_system-${VERSION}-py3-none-any.whl"
          rm -f dist/workstation_living_system-*.whl
          mv "build-dist/workstation_living_system-${VERSION}-py3-none-any.whl" dist/
          rm -rf build-dist
          printf '%s\n' "$VERSION" > VERSION.txt
          sha256sum "dist/workstation_living_system-${VERSION}-py3-none-any.whl" > WHEEL_SHA256.txt
          python - <<'PY'
          from pathlib import Path
          path = Path('INSTALL.ps1')
          text = path.read_text(encoding='utf-8-sig')
          old = '''$Wheel = Get-ChildItem -Path (Join-Path $PackageRoot "dist") -Filter "workstation_living_system-*.whl" | Select-Object -First 1
          if (-not $Wheel) { throw "Bundled WLS wheel was not found." }
          $WheelHashFile = Join-Path $PackageRoot "WHEEL_SHA256.txt"
          '''
          new = '''$VersionFile = Join-Path $PackageRoot "VERSION.txt"
          if (-not (Test-Path $VersionFile)) { throw "VERSION.txt is missing." }
          $PackageVersion = (Get-Content $VersionFile -Raw).Trim()
          $ExpectedWheelName = "workstation_living_system-$PackageVersion-py3-none-any.whl"
          $ExpectedWheelPath = Join-Path (Join-Path $PackageRoot "dist") $ExpectedWheelName
          if (-not (Test-Path $ExpectedWheelPath)) { throw "Expected bundled WLS wheel was not found: $ExpectedWheelName" }
          $Wheel = Get-Item $ExpectedWheelPath
          $ExtraWheels = @(Get-ChildItem -Path (Join-Path $PackageRoot "dist") -Filter "workstation_living_system-*.whl" | Where-Object { $_.FullName -ne $Wheel.FullName })
          if ($ExtraWheels.Count -ne 0) { throw "Multiple WLS wheels are present; refusing ambiguous installation." }
          $WheelHashFile = Join-Path $PackageRoot "WHEEL_SHA256.txt"
          '''
          if old not in text:
              raise SystemExit('installer wheel-selection baseline block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify exported release tree without Git metadata
        run: python VERIFY_RELEASE.py
      - name: Regenerate full release hash inventory
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/round001-release-build.yml
          git add -A
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          lines = []
          for name in sorted(tracked):
              if name == 'SHA256SUMS.txt':
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{name}')
          Path('SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python VERIFY_RELEASE.py
      - name: Commit reproducible alpha release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'round-001: build reproducible 0.1.0a1 release'
          git push origin HEAD:round/001-reproducible-baseline
