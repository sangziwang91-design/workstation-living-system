name: Package metadata sync

on:
  push:
    paths:
      - "state/build-request.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync package metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("source/pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = 'wls = "wls.cli:main"'
          new = 'wls = "wls.ext_cli:main"'
          if old in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
          elif new not in text:
              raise SystemExit("expected entrypoint not found")
          PY
      - name: Commit metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/pyproject.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: sync package entrypoint"
          git push origin HEAD:main
