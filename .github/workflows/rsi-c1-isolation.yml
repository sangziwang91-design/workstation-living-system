name: WLS C1 Ephemeral Candidate Isolation Probe

on:
  pull_request:
    paths:
      - "source/src/wls/isolation_runner.py"
      - "source/scripts/verify_rsi_isolation.py"
      - "source/tests/test_isolation_runner.py"
      - ".github/workflows/rsi-c1-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wls-c1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c1-disposable-containment:
    name: C1 real Docker deny probes x2
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WLS_RSI_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout unprivileged read-only workspace
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install canonical WLS wheel for probe
        run: python -m pip install -e ".[dev]"
      - name: Test static containment contract
        run: python -m pytest -q source/tests/test_isolation_runner.py
      - name: Resolve exact immutable Python base image before candidate execution
        shell: bash
        run: |
          docker pull python:3.13-slim
          digest="$(docker image inspect python:3.13-slim --format '{{index .RepoDigests 0}}')"
          if ! [[ "$digest" =~ ^python@sha256:[a-f0-9]{64}$ ]]; then
            echo "Unexpected image digest, refusing execution" >&2
            exit 2
          fi
          echo "WLS_C1_PINNED_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Verify benign and hostile candidates twice without credential forwarding
        run: python source/scripts/verify_rsi_isolation.py
      - name: Preserve machine-verifiable candidate-only receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-c1-isolation-evidence
          path: c1-isolation-report.json
          if-no-files-found: warn
