name: Verify Provider Hub

on:
  pull_request:
    paths:
      - "source/src/wls/provider_*.py"
      - "source/src/wls/server.py"
      - "docs/PROVIDER_HUB.md"
      - ".github/workflows/provider-hub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-hub:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verification tools
        working-directory: source
        run: python -m pip install -e ".[dev]"
      - name: Compile
        working-directory: source
        run: python -m compileall -q src/wls
      - name: Import provider modules
        working-directory: source
        run: python -c "from wls.provider_hub import ProviderHub, PRESETS; from wls.provider_ui import PROVIDER_HUB_HTML; assert len(PRESETS) >= 6; assert 'WLS Provider Hub' in PROVIDER_HUB_HTML; print('provider hub imports verified')"
      - name: Lint provider hub
        working-directory: source
        run: python -m ruff check src/wls/provider_hub.py
      - name: Lint provider vault
        working-directory: source
        run: python -m ruff check src/wls/provider_secrets.py
      - name: Lint provider UI
        working-directory: source
        run: python -m ruff check src/wls/provider_ui.py
      - name: Lint provider CLI
        working-directory: source
        run: python -m ruff check src/wls/provider_cli.py
      - name: Lint server integration
        working-directory: source
        run: python -m ruff check src/wls/server.py
      - name: Capture full-source lint report
        working-directory: source
        shell: bash
        run: python -m ruff check src --output-format=json > ruff-source.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: provider-hub-ruff-${{ matrix.os }}-${{ matrix.python-version }}
          path: source/ruff-source.json
          retention-days: 3
      - name: Gate complete source lint
        working-directory: source
        run: python -m ruff check src
      - name: Lint complete test tree
        working-directory: source
        run: python -m ruff check tests
