name: Verify Provider Hub

on:
  pull_request:
    paths:
      - "source/src/wls/provider_*.py"
      - "source/src/wls/server.py"
      - "source/tests/test_provider_hub.py"
      - "docs/PROVIDER_HUB.md"
      - ".github/workflows/provider-hub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-hub:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        working-directory: source
        run: python -m pip install -e ".[dev]"
      - name: Compile
        working-directory: source
        run: python -m compileall -q src/wls
      - name: Test
        working-directory: source
        run: python -m pytest tests/test_provider_hub.py -q
      - name: Lint
        working-directory: source
        run: python -m ruff check src/wls tests/test_provider_hub.py
