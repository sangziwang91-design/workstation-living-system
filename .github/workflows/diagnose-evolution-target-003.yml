name: Diagnose EVOLUTION-TARGET-003

on:
  push:
    branches:
      - evolution-target-003-causal-memory
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution-target-003-causal-memory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e "source[dev]"
      - name: Capture full ET003 probe
        shell: bash
        run: |
          set +e
          python source/scripts/verify_evolution_target_003.py --output .github/et003-diagnostic.json
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/et003-diagnostic.json
          git commit -m "test(et003): capture failing probe diagnostics"
          git push origin HEAD:evolution-target-003-causal-memory
