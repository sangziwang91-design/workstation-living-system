name: Diagnose EVOLUTION-TARGET-003

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e "source[dev]"
      - run: python source/scripts/verify_evolution_target_003.py
