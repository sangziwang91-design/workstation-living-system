name: WLS One-Time Final Orphan Ref Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wls-prune-final-orphan.yml"

permissions:
  contents: read

jobs:
  delete-single-obsolete-ref:
    if: github.repository == 'sangziwang91-design/workstation-living-system' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact old SHA, trusted main and no open PR before branch deletion
        shell: bash
        run: |
          set -euo pipefail
          repo='sangziwang91-design/workstation-living-system'
          orphan='feat/r1-fresh-state-100-windows-20261017'
          old='adf6c371a8066d21a5fc9e3ef87761d8984725a5'
          current="$(gh api "repos/$repo/commits/main" --jq '.sha')"
          test "$current" = "$GITHUB_SHA"
          target="$(gh api "repos/$repo/git/ref/heads/$orphan" --jq '.object.sha')"
          test "$target" = "$old"
          open_count="$(gh api "repos/$repo/pulls?state=open&per_page=100" --jq 'length')"
          test "$open_count" = '0'
          behind="$(gh api "repos/$repo/compare/$old...$current" --jq '.behind_by')"
          test "$behind" = '0'
          ahead="$(gh api "repos/$repo/compare/$old...$current" --jq '.ahead_by')"
          test "$ahead" -ge 1
          gh api --method DELETE "repos/$repo/git/refs/heads/$orphan"
          remaining="$(gh api "repos/$repo/branches?per_page=100" --jq 'map(.name) | join(",")')"
          test "$remaining" = 'main'
          echo "FINAL_BRANCH_CLEANUP_VERIFIED only_main_remaining=true old_sha=$old"
