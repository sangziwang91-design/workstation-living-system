name: Verify Repo-Native Evolution Chain

on:
  pull_request:
    paths:
      - "EVOLUTION_CHAIN.md"
      - ".evolution/**"
      - "source/scripts/validate_evolution_chain.py"
      - "source/tests/test_evolution_chain.py"
      - ".github/workflows/evolution-chain.yml"
  push:
    branches: [main]
    paths:
      - "EVOLUTION_CHAIN.md"
      - ".evolution/**"
      - "source/scripts/validate_evolution_chain.py"
      - "source/tests/test_evolution_chain.py"
      - ".github/workflows/evolution-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: D:\actions-runner\_cache\pip
  TEMP: D:\actions-runner\_temp
  TMP: D:\actions-runner\_temp

jobs:
  verify-control-plane:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest]
        python-version: ["3.11"]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Prepare D-drive runtime directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:PIP_CACHE_DIR | Out-Null
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Validate evolution control plane
        run: python source/scripts/validate_evolution_chain.py
      - name: Run focused evolution-chain tests
        run: python -m pytest source/tests/test_evolution_chain.py -q
