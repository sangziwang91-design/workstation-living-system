name: Verify Repo-Native Evolution Chain

on:
  pull_request:
    paths:
      - "EVOLUTION_CHAIN.md"
      - ".evolution/**"
      - "source/scripts/validate_evolution_chain.py"
      - "source/tests/test_evolution_chain.py"
      - ".github/workflows/evolution-chain.yml"
      - ".github/scripts/prepare-windows-runner.ps1"
  push:
    branches: [main]
    paths:
      - "EVOLUTION_CHAIN.md"
      - ".evolution/**"
      - "source/scripts/validate_evolution_chain.py"
      - "source/tests/test_evolution_chain.py"
      - ".github/workflows/evolution-chain.yml"
      - ".github/scripts/prepare-windows-runner.ps1"
  workflow_dispatch:
    inputs:
      run_owner_host:
        description: "Run the explicit owner-controlled Windows self-hosted diagnostic"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: evolution-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: D:\actions-runner\_cache\pip
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TEMP: D:\actions-runner\_temp
  TMP: D:\actions-runner\_temp

jobs:
  # Public contributors never dispatch untrusted PR code to the owner's PC.
  # Preserve local diagnostics only behind an explicit owner-host opt-in.
  verify-control-plane:
    if: github.event_name == 'workflow_dispatch' && inputs.run_owner_host == true
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Prepare D-drive runtime directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:PIP_CACHE_DIR | Out-Null
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare isolated local Python
        shell: powershell
        run: .\.github\scripts\prepare-windows-runner.ps1 -PythonVersion "3.11"
      - name: Install focused test dependency
        shell: powershell
        run: '& $env:PYTHON_EXE -m pip install --retries 10 --timeout 120 pytest'
      - name: Validate evolution control plane
        shell: powershell
        run: '& $env:PYTHON_EXE source/scripts/validate_evolution_chain.py'
      - name: Run focused evolution-chain tests
        shell: powershell
        run: '& $env:PYTHON_EXE -m pytest source/tests/test_evolution_chain.py -q'

  verify-hosted:
    name: Hosted evolution chain verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install isolated test runner
        run: python -m pip install pytest
      - name: Validate the tracked evolution control plane
        run: python source/scripts/validate_evolution_chain.py
      - name: Test the repository evolution chain
        run: python -m pytest -q source/tests/test_evolution_chain.py
