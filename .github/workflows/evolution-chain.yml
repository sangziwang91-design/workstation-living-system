name: Verify Repo-Native Evolution Chain

on:
  pull_request:
    paths:
      - "EVOLUTION_CHAIN.md"
      - ".evolution/**"
      - "source/scripts/validate_evolution_chain.py"
      - "source/tests/test_evolution_chain.py"
      - ".github/workflows/evolution-chain.yml"
  push:
    branches: [main]
    paths:
      - "EVOLUTION_CHAIN.md"
      - ".evolution/**"
      - "source/scripts/validate_evolution_chain.py"
      - "source/tests/test_evolution_chain.py"
      - ".github/workflows/evolution-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Validate evolution control plane
        run: python source/scripts/validate_evolution_chain.py
      - name: Run focused evolution-chain tests
        run: python -m pytest source/tests/test_evolution_chain.py -q
