name: Verify Repo-Native Evolution Chain

on:
  pull_request:
    paths:
      - "EVOLUTION_CHAIN.md"
      - ".evolution/**"
      - "source/scripts/validate_evolution_chain.py"
      - "source/tests/test_evolution_chain.py"
      - ".github/workflows/evolution-chain.yml"
      - ".github/scripts/prepare-windows-runner.ps1"
  push:
    branches: [main]
    paths:
      - "EVOLUTION_CHAIN.md"
      - ".evolution/**"
      - "source/scripts/validate_evolution_chain.py"
      - "source/tests/test_evolution_chain.py"
      - ".github/workflows/evolution-chain.yml"
      - ".github/scripts/prepare-windows-runner.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-hosted:
    name: Hosted evolution chain verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install isolated test runner
        run: python -m pip install pytest
      - name: Validate the tracked evolution control plane
        run: python source/scripts/validate_evolution_chain.py
      - name: Test the repository evolution chain
        run: python -m pytest -q source/tests/test_evolution_chain.py
