name: Manual Ubuntu Cross-Platform Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-ubuntu-cross-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install WLS and verification toolchain from root
        run: python -m pip install -e ".[dev]"
      - name: Verify repository layout
        run: python source/scripts/verify_packaging_layout.py
      - name: Compile
        run: python -m compileall -q source/src source/tests source/scripts
      - name: Tests
        run: python -m pytest source/tests -q
      - name: Run available evolution target verifiers
        shell: bash
        run: |
          set -euo pipefail
          for verifier in \
            source/scripts/verify_evolution_target_001.py \
            source/scripts/verify_evolution_target_002.py \
            source/scripts/verify_evolution_target_003.py \
            source/scripts/verify_evolution_target_004.py; do
            if [[ -f "$verifier" ]]; then
              python "$verifier"
            fi
          done
      - name: Lint
        run: python -m ruff check source/src source/tests source/scripts
      - name: Types
        run: python -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports
      - name: Bandit
        run: python -m bandit -q -r source/src/wls source/scripts
      - name: Build package
        run: python -m build .
