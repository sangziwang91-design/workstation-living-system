name: GitHub Hosted Actual LLM RSI Coding

on:
  pull_request:
    paths:
      - "source/scripts/github_rsi_local_model.py"
      - "source/scripts/github_rsi_replay_model.py"
      - "source/scripts/measure_rsi_self_code_model.py"
      - "source/scripts/replay_rsi_self_code_model.py"
      - "source/scripts/measure_rsi_self_code_g2.py"
      - "source/tests/test_rsi_self_code_g2.py"
      - "source/scripts/measure_rsi_self_code_method_edit.py"
      - "source/scripts/measure_rsi_self_code_g3_method_feedback.py"
      - "source/tests/test_rsi_self_code_method_edit.py"
      - "source/tests/test_rsi_self_code_g3_method_feedback.py"
      - "source/scripts/measure_rsi_qwen7b_failure_feedback_retry.py"
      - "source/tests/test_rsi_qwen7b_failure_feedback_retry.py"
      - ".github/workflows/hosted-rsi-local-model.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wls-real-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model-candidate:
    name: Real CPU coder model source proposal and held-out tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      accepted: ${{ steps.replay.outputs.accepted == 'true' || steps.propose.outputs.accepted == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install WLS and independent test runner
        run: python -m pip install -e ".[dev]"
      - name: Check whether actual code-model inference is still necessary
        id: preflight
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from wls.coding_adapter import CodingTaskContract
          # Next WLS coding security defect: embedded NUL filenames can
          # poison audit lines. Check a real contract rather than a mock flag.
          with TemporaryDirectory() as folder:
              contract = CodingTaskContract(
                  task_id="preflight", base_sha="head",
                  worktree=Path(folder).resolve(),
                  changed_files=["module.py\x00other.py"], tests=["pytest"],
                  rollback=["discard"],
              )
              try:
                  contract.validate()
              except ValueError as exc:
                  # A raw OS 'embedded null byte' exception is NOT correct
                  # task validation. Require the canonical contract error.
                  needed = 'changed files must be relative paths' not in str(exc)
              else:
                  needed = True
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"needs_model={'true' if needed else 'false'}\n")
          print("Model inference necessary:", needed)
          PY
      - name: Reuse pinned authentic 2026-10-08 GGUF failed inference receipt
        if: steps.preflight.outputs.needs_model == 'true'
        id: prior
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wls-real-cpu-model-37765939009
          run-id: 37765939009
          github-token: ${{ github.token }}
          path: recovered-model-evidence
      - name: Regrade genuine generated predicate against independent owner oracle
        if: steps.preflight.outputs.needs_model == 'true' && steps.prior.outcome == 'success'
        id: replay
        continue-on-error: true
        run: python source/scripts/github_rsi_replay_model.py
      - name: Install local CPU coder only if archived model response could not be reused
        if: steps.preflight.outputs.needs_model == 'true' && steps.replay.outputs.accepted != 'true'
        run: python -m pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu "llama-cpp-python==0.3.16"
      - name: "Real model generates source repair, WLS tests independently decide"
        if: steps.preflight.outputs.needs_model == 'true' && steps.replay.outputs.accepted != 'true'
        id: propose
        timeout-minutes: 23
        run: python source/scripts/github_rsi_local_model.py
      - name: Archive actual model, proposal and independent grader evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-real-cpu-model-${{ github.run_id }}
          path: |
            rsi-model-report.json
            rsi-model-candidate.patch
          if-no-files-found: warn

  # The model never receives a write-capable GitHub token. An independent
  # promotion job checks every byte before updating the existing feature PR.
  persist-verified-model-fix:
    needs: real-model-candidate
    if: >-
      github.event_name == 'pull_request' &&
      needs.real-model-candidate.outputs.accepted == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'feat/rsi-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      BASE_SHA: ${{ github.event.pull_request.head.sha }}
      FEATURE_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wls-real-cpu-model-${{ github.run_id }}
      - name: Admit only precisely graded real model candidate
        shell: bash
        run: |
          python -I -S - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          data = json.loads(Path('rsi-model-report.json').read_text(encoding='utf-8'))
          patch = Path('rsi-model-candidate.patch').read_bytes()
          assert data['schema'] == 'wls.hosted_small_llm_coding.v1'
          assert data['base_sha'] == os.environ['BASE_SHA']
          assert data['model_id'] == 'Qwen2.5-Coder-0.5B-Instruct-Q4_K_M'
          assert data['model_sha256'] == '0128e77564e43d40682f82d7ebe8a9abdf0c24c8f55fa85629f8cc156b1b6560'
          if data.get('replayed_from_run') is not None:
              assert data['replayed_from_run'] == 37765939009
              assert data['model_called'] is False
          assert data['goal_id'] == 'safe_relative_embedded_nul_v3'
          assert data['accepted'] is True
          assert data['source'] == 'source/src/wls/coding_adapter.py'
          assert data['original_hidden_test_exit'] != 0
          assert 1 <= len(data['generations']) <= 3
          assert any(
              r.get('accepted') is True and
              r.get('oracle_exit') == 0 and
              r.get('full_suite_exit') == 0
              for r in data['generations']
          )
          assert hashlib.sha256(patch).hexdigest() == data['patch_sha256']
          subprocess.run(['git', 'apply', '--check', 'rsi-model-candidate.patch'], check=True)
          subprocess.run(['git', 'apply', 'rsi-model-candidate.patch'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert changed == ['source/src/wls/coding_adapter.py']
          print('Admitted real model-generated code based only on independent grades')
          PY
      - name: Retain proven fix on the existing draft feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source/src/wls/coding_adapter.py
          git commit -m "RSI: retain independently verified local model-generated WLS coding repair"
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"

  real-qwen-self-code-paired:
    name: Real offline Qwen self-code guided/unguided C1 measurement
    # This two-call sample is already frozen in the authentic run below.
    # Future PR commits replay its exact bytes instead of spending new inference.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      WLS_RSI_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Checkout exact unprivileged candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.11 on public GitHub runner
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install WLS and existing pinned CPU model adapter
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu "llama-cpp-python==0.3.16"
      - name: Pin existing C1 read-only Python Docker isolation image
        shell: bash
        run: |
          docker pull python:3.13-slim
          digest="$(docker image inspect python:3.13-slim --format '{{index .RepoDigests 0}}')"
          if ! [[ "$digest" =~ ^python@sha256:[a-f0-9]{64}$ ]]; then
            echo "No pinned isolated evaluator image" >&2
            exit 2
          fi
          echo "WLS_C1_PINNED_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Run two REAL pinned Qwen 1.5B WLS self-code attempts with independent Docker grading
        timeout-minutes: 29
        run: |
          python source/scripts/measure_rsi_self_code_model.py \
            --model-file "$RUNNER_TEMP/wls-real-self-code-qwen-1.5b.gguf" \
            --artifact-root "$RUNNER_TEMP/wls-real-self-code-candidates" \
            --report rsi-self-code-model-observed.json
      - name: Preserve public model receipts, scoped source and manifests only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-real-qwen-self-code-${{ github.run_id }}
          path: |
            rsi-self-code-model-observed.json
            ${{ runner.temp }}/wls-real-self-code-candidates/*/candidates/*/manifest.json
            ${{ runner.temp }}/wls-real-self-code-candidates/*/candidates/*/source/src/wls/skill_compiler.py
          retention-days: 30
          if-no-files-found: warn

  replay-authentic-qwen-self-code:
    name: Replay authentic Qwen self-code in C1 without another model call
    if: github.event_name == 'pull_request' && github.head_ref != 'experiment/qwen-g2-parent-feedback-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      WLS_RSI_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Checkout exact unprivileged WLS source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install existing WLS evaluator only
        run: python -m pip install -e ".[dev]"
      - name: Fetch frozen authentic Qwen replies from exact historical run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wls-real-qwen-self-code-42486361106
          run-id: 42486361106
          github-token: ${{ github.token }}
          path: replay-authentic-qwen
      - name: Pull exact original C1 Python Docker image
        shell: bash
        run: |
          digest="python@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90"
          docker pull "$digest"
          echo "WLS_C1_PINNED_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Verify original response hashes, admit source only, C1 regrade
        run: |
          file="$(find replay-authentic-qwen -type f -name rsi-self-code-model-observed.json)"
          if [ "$(printf '%s\n' "$file" | wc -l)" -ne 1 ] || [ ! -f "$file" ]; then
            echo "Missing unique original paired model receipt" >&2
            exit 2
          fi
          python source/scripts/replay_rsi_self_code_model.py \
            --prior "$file" \
            --archive-root "$RUNNER_TEMP/wls-qwen-replayed-candidates" \
            --report rsi-self-code-replay-observed.json
      - name: Publish public replay measurements and scoped candidate source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-qwen-real-source-replay-${{ github.run_id }}
          path: |
            rsi-self-code-replay-observed.json
            ${{ runner.temp }}/wls-qwen-replayed-candidates/*/candidates/*/manifest.json
            ${{ runner.temp }}/wls-qwen-replayed-candidates/*/candidates/*/source/src/wls/skill_compiler.py
          retention-days: 30
          if-no-files-found: warn

  real-qwen-g2-parent-vs-restart:
    name: Real offline Qwen G2 model-parent versus fresh retry C1 comparison
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'experiment/qwen-g2-parent-feedback-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      WLS_RSI_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Checkout fixed exact-head WLS experiment (no persistent token)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install current WLS and pinned local CPU model adapter
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu "llama-cpp-python==0.3.16"
      - name: Fetch genuine first-generation failed Qwen source and grade
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wls-qwen-real-source-replay-42545022067
          run-id: 42545022067
          github-token: ${{ github.token }}
          path: g1-replay-source
      - name: Pin the same independent C1 Docker evaluator image
        shell: bash
        run: |
          digest="python@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90"
          docker pull "$digest"
          echo "WLS_C1_PINNED_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Independently verify historic parent, run same-model matched one-call G2 arms
        timeout-minutes: 29
        shell: bash
        run: |
          source_file="$(find g1-replay-source -type f -path '*/guided/candidates/model-replay/source/src/wls/skill_compiler.py')"
          grade_file="$(find g1-replay-source -type f -name rsi-self-code-replay-observed.json)"
          if [[ "$(printf '%s\n' "$source_file" | wc -l)" -ne 1 || \
                "$(printf '%s\n' "$grade_file" | wc -l)" -ne 1 || \
                ! -f "$source_file" || ! -f "$grade_file" ]]; then
            echo "Missing exact one G1 source and genuine independent grade" >&2
            exit 2
          fi
          python source/scripts/measure_rsi_self_code_g2.py \
            --model-file "$RUNNER_TEMP/wls-qwen-g2-1.5b.gguf" \
            --g1-source "$source_file" \
            --g1-report "$grade_file" \
            --artifact-root "$RUNNER_TEMP/wls-qwen-g2-archive" \
            --report rsi-self-code-g2-observed.json
      - name: Publish G2 raw model receipts and exact candidate bytes, never ledger keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-qwen-g2-model-self-code-${{ github.run_id }}
          path: |
            rsi-self-code-g2-observed.json
            ${{ runner.temp }}/wls-qwen-g2-archive/*/candidates/*/manifest.json
            ${{ runner.temp }}/wls-qwen-g2-archive/*/candidates/*/source/src/wls/skill_compiler.py
          retention-days: 30
          if-no-files-found: warn

  verify-authentic-g2-novelty:
    name: Independently reconcile prior real G2 source hashes without inference
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/qwen-g2-parent-feedback-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact pinned accounting code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch frozen authentic two-call experiment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wls-qwen-g2-model-self-code-42550772725
          run-id: 42550772725
          github-token: ${{ github.token }}
          path: authentic-g2
      - name: Independently recompute source novelty from archived bytes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("authentic-g2")
          reports = list(root.rglob("rsi-self-code-g2-observed.json"))
          assert len(reports) == 1, "exactly one archived real-model report required"
          data = json.loads(reports[0].read_text(encoding="utf-8"))
          assert data["schema"] == "wls.rsi.real_qwen_self_code_g2.v1"
          assert data["status"] == "PAIRED_G2_MEASURED"
          assert data["model_calls_observed"] == 2
          assert data["model_sha256"] == "cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046"
          assert data["evaluator_digest"] == "d1451b7cfa80904d08296f0d4247b79a17848462d84f154ff1c779e141f780a9"
          assert data["g1_model_source_sha256"] == "da3f9d139206a51f02a8b1d4c3c41741cb853528385020d0aba856735bd296c5"
          arms = ("fresh_restart", "inherited_g1")
          source_shas = set()
          changed_shas = set()
          outcomes = {}
          for arm in arms:
              receipt = data["arms"][arm]
              files = list(root.glob("**/" + arm + "/candidates/rsi-*/source/src/wls/skill_compiler.py"))
              assert len(files) == 1, "one immutable model-produced source per arm"
              source_sha = hashlib.sha256(files[0].read_bytes()).hexdigest()
              assert source_sha == receipt["candidate_source_sha256"]
              assert len(receipt["model_receipts"]) == 1
              assert receipt["model_receipts"][0]["output_tokens"] <= 2048
              assert receipt["ledger_verified"] is True
              assert receipt["pilot_generation"] == 2
              changed = source_sha != receipt["parent_source_sha256"]
              assert changed == receipt["source_changed_from_parent"]
              passed = changed and any(
                  m["passes"] is True and m["source_sha256"] == source_sha
                  for m in receipt["g2_independent_measurement"]
              )
              assert passed == receipt["passes_both"]
              source_shas.add(source_sha)
              if changed:
                  changed_shas.add(source_sha)
              outcomes[arm] = {
                  "source_sha256": source_sha,
                  "source_changed_from_parent": changed,
                  "independently_passing_changed_source": bool(passed),
                  "model_calls": len(receipt["model_receipts"]),
              }
          assert sum(int(a["independently_passing_changed_source"])
                     for a in outcomes.values()) == data["passing_arms"]
          result = {
              "schema": "wls.rsi.real_qwen_g2_novelty_reconciliation.v1",
              "real_model_run_id": 42550772725,
              "model_calls_replayed": 0,
              "authentic_model_calls": 2,
              "archived_distinct_snapshots": len(source_shas),
              "new_distinct_sources": len(changed_shas),
              "passing_arms": data["passing_arms"],
              "arms": outcomes,
              "rsi": "UNPROVEN",
              "heldout_gain": "UNMEASURED",
          }
          Path("rsi-g2-novelty-verified.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Preserve separately checked G2 novelty accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-g2-novelty-reconciled-${{ github.run_id }}
          path: rsi-g2-novelty-verified.json
          retention-days: 30
          if-no-files-found: warn

  real-qwen-g3-feedback-versus-fresh:
    name: Two real Qwen G3 local-method arms with frozen C1 grading
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/qwen-g3-feedback-versus-fresh-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      WLS_RSI_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Checkout exact G3 head without credential persistence
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install existing WLS and pinned local CPU model support
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu "llama-cpp-python==0.3.16"
      - name: Verify original method-adapter and G3 provenance controls
        run: |
          python -m pytest -q source/tests/test_rsi_self_code_method_edit.py source/tests/test_rsi_self_code_g3_method_feedback.py
      - name: Download exact historical Qwen method-edit source from another Actions run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wls-qwen-method-edit-42552809929
          run-id: 42552809929
          github-token: ${{ github.token }}
          path: prior-real-qwen-method
      - name: Pull unchanged immutable C1 independent grader image
        shell: bash
        run: |
          digest="python@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90"
          docker pull "$digest"
          echo "WLS_C1_PINNED_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Run two genuine equal-call Qwen 1.5B method-edit attempts
        timeout-minutes: 23
        run: |
          python source/scripts/measure_rsi_self_code_g3_method_feedback.py \
            --previous-root prior-real-qwen-method \
