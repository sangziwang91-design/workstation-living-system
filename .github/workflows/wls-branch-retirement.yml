name: WLS One-Time Legacy Branch Retirement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wls-branch-retirement.yml
      - source/scripts/prune_legacy_branches.py
      - docs/audits/BRANCH_RETIREMENT_2026-10-16.json

permissions:
  contents: read

concurrency:
  group: wls-main-branch-retirement
  cancel-in-progress: false

jobs:
  retire-stale-refs:
    if: github.repository == 'sangziwang91-design/workstation-living-system' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    name: Archive all unique branch tips before exact-SHA prune
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: WLS Github Branch Archive
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: WLS Github Branch Archive
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Read canonical trusted main (not PR source)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Python on hosted Windows
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate immutable exact-SHA branch inventory
        shell: pwsh
        run: |
          python source/scripts/prune_legacy_branches.py validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure ephemeral Git credential for archival tag only
        shell: pwsh
        run: |
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve history as one permanent archival Git tag then prune 121 refs
        shell: pwsh
        run: |
          python source/scripts/prune_legacy_branches.py execute
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain inspectable redacted deletion receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-legacy-branch-retirement-receipt
          path: branch-retirement-receipt.json
          if-no-files-found: warn
          retention-days: 90
