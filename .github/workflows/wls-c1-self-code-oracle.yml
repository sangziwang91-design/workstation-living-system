name: WLS C1 Self-Code Oracle Calibration

on:
  pull_request:
    paths:
      - ".github/workflows/wls-c1-self-code-oracle.yml"
      - "source/scripts/measure_rsi_self_code_model.py"
      - "source/src/wls/skill_compiler.py"
      - "source/tests/fixtures/rsi_skill_compiler_20261108.py.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wls-c1-self-code-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  positive-negative-controls:
    name: Original WLS defect fails and canonical fixed WLS code passes C1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WLS_C1_PINNED_IMAGE: python@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Checkout exact source without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install only existing WLS evaluator
        run: python -m pip install -e ".[dev]"
      - name: Pull the same immutable C1 networkless Docker image
        run: docker pull "$WLS_C1_PINNED_IMAGE"
      - name: Execute true negative and known-correct positive through unchanged C1 grader
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "source/scripts")
          from measure_rsi_self_code_model import _pin_source, _grade_source
          image = os.environ["WLS_C1_PINNED_IMAGE"]
          original = _pin_source().decode("utf-8")
          canonical_fix = Path("source/src/wls/skill_compiler.py").read_text(encoding="utf-8")
          negative = _grade_source(original, image)
          positive = _grade_source(canonical_fix, image)
          evidence = {
              "schema": "wls.rsi.self_code_c1_oracle_calibration.v1",
              "candidate_source": "existing merged WLS SkillCompiler; never model generated",
              "original_source_sha256": hashlib.sha256(original.encode()).hexdigest(),
              "known_fix_source_sha256": hashlib.sha256(canonical_fix.encode()).hexdigest(),
              "image": image,
              "negative_behavior": negative["behavior"],
              "negative_regression": negative["regression"],
              "positive_behavior": positive["behavior"],
              "positive_regression": positive["regression"],
              "model_calls": 0,
              "rsi": "UNPROVEN",
              "claim_ceiling": "C1 grader discrimination on one known WLS defect; no model gain",
          }
          Path("c1-calibration-observed.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, sort_keys=True))
          assert original != canonical_fix, "positive and negative sources identical"
          assert negative["behavior"] != "EXIT_0", "broken original falsely passes target"
          assert negative["regression"] == "EXIT_0", "original no longer preserves regression"
          assert positive["behavior"] == "EXIT_0", "known correct WLS code fails target"
          assert positive["regression"] == "EXIT_0", "known correct WLS code fails regression"
          PY
      - name: Retain oracle control statuses only; no source or signing keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-c1-oracle-calibration-${{ github.run_id }}
          path: c1-calibration-observed.json
          retention-days: 30
          if-no-files-found: warn
