name: WLS RSI Pilot Candidate Gate

on:
  pull_request:
    paths:
      - "source/src/wls/rsi_evolution.py"
      - "source/src/wls/experiment_decision.py"
      - "source/src/wls/loop_control.py"
      - "source/src/wls/coding_workers.py"
      - "source/src/wls/runtime.py"
      - "source/tests/test_rsi_evolution.py"
      - "source/tests/test_rsi_artifact_gate.py"
      - "source/src/wls/rsi_artifact_gate.py"
      - "source/src/wls/rsi_model_port.py"
      - "source/tests/test_rsi_model_port.py"
      - "source/tests/test_rsi_risk_cli.py"
      - "source/tests/test_agentbridge_handoff.py"
      - "source/tests/test_agentbridge_full_roundtrip.py"
      - "source/src/wls/agentic_harness.py"
      - "source/src/wls/cli.py"
      - "source/src/wls/task_admission.py"
      - "source/tests/test_coding_workers.py"
      - "docs/RSI_PILOT_FIVE_GATES.md"
      - "docs/RSI_PRODUCTION_PATH_V1.md"
      - "source/scripts/verify_rsi_100_generations.py"
      - "source/scripts/verify_rsi_50_faults.py"
      - ".github/workflows/rsi-pilot.yml"
  workflow_dispatch:
    inputs:
      approve_model_usage:
        description: "I authorize up to TWO provider inference calls (potential metered usage)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  # GitHub-hosted Windows proof does not depend on the owner's offline
  # self-hosted runner. A short deadline bounds included-minute usage.
  windows-candidate-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install minimum proof dependencies
        run: python -m pip install -e . "pytest>=8"
      - name: Windows repository invariant and targeted WLS RSI regressions
        run: |
          python source/scripts/verify_packaging_layout.py
          python -m pytest -q source/tests/test_rsi_evolution.py source/tests/test_experiment_decision.py source/tests/test_loop_control.py source/tests/test_coding_workers.py source/tests/test_rsi_artifact_gate.py source/tests/test_rsi_model_port.py source/tests/test_rsi_risk_cli.py source/tests/test_agentbridge_handoff.py source/tests/test_agentbridge_full_roundtrip.py
      - name: Windows 100-generation durability proof
        run: python source/scripts/verify_rsi_100_generations.py --report rsi-100-windows.json
      - name: Windows RSI 50-round adversarial audit
        run: python source/scripts/verify_rsi_50_faults.py --report rsi-50-windows.json
      - name: Upload Windows proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-harness-100-windows
          path: |
            rsi-100-windows.json
            rsi-50-windows.json
          if-no-files-found: warn

  candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verified root package and tools
        run: python -m pip install -e ".[dev]"
      - name: Repository invariant
        run: python source/scripts/verify_packaging_layout.py
      # Test *both actual packages together*, not just JSON stand-ins.
      # Open bridge commit is pinned; it is public and never receives WLS secrets.
      - name: Checkout pinned public AgentBridge for live protocol integration
        if: matrix.python-version == '3.13'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: sangziwang91-design/open
          ref: a2075c98f70e9a745c59633a2b3bc76842aea864
          path: external-agentbridge
          persist-credentials: false
      - name: Install public bridge for cross-repository process roundtrip
        if: matrix.python-version == '3.13'
        run: python -m pip install -e ./external-agentbridge
      - name: RSI pilot and existing decision regressions
        run: |
          python -m pytest -q source/tests/test_rsi_evolution.py             source/tests/test_experiment_decision.py             source/tests/test_loop_control.py             source/tests/test_coding_workers.py             source/tests/test_rsi_artifact_gate.py source/tests/test_rsi_model_port.py source/tests/test_rsi_risk_cli.py source/tests/test_agentbridge_handoff.py source/tests/test_agentbridge_full_roundtrip.py
      - name: Execute 100-generation / 200-candidate deterministic stress proof
        run: python source/scripts/verify_rsi_100_generations.py --report rsi-100-proof.json
      - name: Run 50-round fault-injection matrix against real WLS state
        run: python source/scripts/verify_rsi_50_faults.py --report rsi-50-proof.json
      - name: Upload 100-generation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-harness-100-${{ matrix.python-version }}
          path: |
            rsi-100-proof.json
            rsi-50-proof.json
          if-no-files-found: warn
      - name: Lint changed RSI surfaces
        run: |
          python -m ruff check             source/src/wls/rsi_evolution.py             source/src/wls/rsi_artifact_gate.py             source/src/wls/rsi_model_port.py             source/src/wls/task_admission.py             source/src/wls/experiment_decision.py             source/src/wls/loop_control.py             source/src/wls/coding_workers.py             source/tests/test_rsi_evolution.py             source/tests/test_rsi_artifact_gate.py             source/tests/test_rsi_model_port.py             source/tests/test_rsi_risk_cli.py             source/tests/test_agentbridge_handoff.py             source/tests/test_agentbridge_full_roundtrip.py             source/scripts/verify_rsi_100_generations.py             source/scripts/verify_rsi_50_faults.py


  # Explicit owner opt-in only. Never called on PRs or schedules. The model
  # proposes JSON *data*, not executable patches. GitHub's own runner is not
  # claimed to be a security sandbox for arbitrary model-authored programs.
  github-risk-trial:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_model_usage == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WLS_RSI_API_KEY: ${{ secrets.WLS_RSI_API_KEY }}
      WLS_RSI_BASE_URL: ${{ vars.WLS_RSI_BASE_URL }}
      WLS_RSI_MODEL_ID: ${{ vars.WLS_RSI_MODEL_ID }}
      WLS_HOME: ${{ github.workspace }}/.wls-risk-home
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Require configured model endpoint and owner approval
        shell: bash
        run: |
          test -n "$WLS_RSI_API_KEY" || { echo "::error::Missing secret WLS_RSI_API_KEY"; exit 1; }
          test -n "$WLS_RSI_BASE_URL" || { echo "::error::Missing variable WLS_RSI_BASE_URL"; exit 1; }
          test -n "$WLS_RSI_MODEL_ID" || { echo "::error::Missing variable WLS_RSI_MODEL_ID"; exit 1; }
      - name: Install WLS
        run: python -m pip install -e .
      - name: Two-call bound WLS RSI task-risk trial
        shell: bash
        run: |
          python -m wls --config "$WLS_HOME/config.json" rsi-risk \
            --run-id "gh-${GITHUB_RUN_ID}" --mode run \
            --model-id "$WLS_RSI_MODEL_ID" --base-url "$WLS_RSI_BASE_URL" \
            --confirm-model-usage --generations 2 --branches 1 \
            > rsi-risk-result.json
          cat rsi-risk-result.json
      - name: Archive candidate evidence and score (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wls-rsi-risk-${{ github.run_id }}
          path: |
            rsi-risk-result.json
            ${{ github.workspace }}/.wls-risk-home/sandbox/rsi_candidate_artifacts
          if-no-files-found: warn
