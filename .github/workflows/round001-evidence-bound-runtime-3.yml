name: round001-evidence-bound-runtime-3

on:
  push:
    branches:
      - round/001-reproducible-baseline
    paths:
      - .github/workflows/round001-evidence-bound-runtime-3.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round/001-reproducible-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply canonical runtime and test migration
        run: python tools/apply_round001_evidence_bound_runtime.py
      - name: Verify complete branch source
        run: |
          python -m pip install -e './source[dev]'
          python -m pytest source/tests --cov=wls --cov-branch --cov-fail-under=65
          python -m ruff check source/src source/tests
          python -m mypy source/src
          python -m bandit -q -r source/src
      - name: Commit canonical evidence-bound runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/src/wls/runtime.py source/src/wls/config.py source/tests/test_e2e_scenarios.py
          git commit -m 'round-001: enforce evidence-bound growth in canonical runtime'
          git push origin HEAD:round/001-reproducible-baseline
