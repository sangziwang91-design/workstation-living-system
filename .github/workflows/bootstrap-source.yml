name: Bootstrap source snapshot

on:
  push:
    paths:
      - "bootstrap/*.tar.gz.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify snapshot
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="bootstrap/wls_source_0.6.0.dev1.tar.gz.b64"
          ARCHIVE="$RUNNER_TEMP/wls_source.tar.gz"
          base64 --decode "$BUNDLE" > "$ARCHIVE"
          echo "da7b2a035afb96a319118edb030f134a179209c58659c7415a1d87ba824d7bc6  $ARCHIVE" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C "$GITHUB_WORKSPACE"
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No expanded-source changes"
            exit 0
          fi
          git commit -m "feat: import verified WLS 0.6.0.dev1 source and evolution loops"
          git push origin HEAD:main
