name: round001-one-time-patch

on:
  push:
    branches:
      - round/001-reproducible-baseline
    paths:
      - tools/apply_round001_atomic_ack.py
      - .github/workflows/round001-one-time-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round/001-reproducible-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact source migration
        run: python tools/apply_round001_atomic_ack.py
      - name: Verify migrated source
        run: |
          python -m pip install -e "./source[dev]"
          python -m pytest source/tests -q
          python -m ruff check source/src source/tests
          python -m mypy source/src
      - name: Remove one-time migration machinery
        run: |
          rm tools/apply_round001_atomic_ack.py
          rm .github/workflows/round001-one-time-patch.yml
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/src/wls/runtime.py source/src/wls/stores.py tools/apply_round001_atomic_ack.py .github/workflows/round001-one-time-patch.yml
          git commit -m "round-001: enforce atomic worker-bound event acknowledgement"
          git push origin HEAD:round/001-reproducible-baseline
