name: Verify EVOLUTION-TARGET-004

on:
  pull_request:
    branches: [main]
    paths:
      - "source/**"
      - "docs/EVOLUTION_TARGET_004.md"
      - "CURRENT_STATE.yaml"
      - "README.md"
      - ".github/workflows/verify-evolution-target-004.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verification toolchain
        run: python -m pip install --upgrade pip build pytest ruff mypy bandit wheel
      - name: Install WLS editable
        run: python -m pip install -e "source[dev]"
      - name: Compile
        run: python -m compileall -q source/src source/tests source/scripts
      - name: Test full suite
        run: python -m pytest source/tests -q
      - name: Verify ET001
        run: python source/scripts/verify_evolution_target_001.py
      - name: Verify ET002
        run: python source/scripts/verify_evolution_target_002.py
      - name: Verify ET003
        run: python source/scripts/verify_evolution_target_003.py
      - name: Verify ET004
        run: python source/scripts/verify_evolution_target_004.py --quiet --output source/verification/EVOLUTION_TARGET_004_CI.json
      - name: Lint
        run: python -m ruff check source/src source/tests source/scripts
      - name: Types
        run: python -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports
      - name: Security
        run: python -m bandit -q -r source/src/wls source/scripts
      - name: Build
        run: python -m build source
