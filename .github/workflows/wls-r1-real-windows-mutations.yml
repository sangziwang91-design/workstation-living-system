name: WLS R1 Real Windows Mutation Evidence

on:
  push:
    branches: [main]
    paths:
      - "source/scripts/make_mutation_tasks.py"
      - "source/scripts/verify_r1_mutation_replay.py"
      - "source/tests/test_r1_real_mutation_discovery.py"
      - "source/tests/test_r1_mutation_replay.py"
      - "source/scripts/score_r2_three_try_baselines.py"
      - "source/tests/test_r2_three_try_baselines.py"
      - "source/scripts/run_r2_copilot_probe.py"
      - "source/tests/test_r2_copilot_probe.py"
      - ".github/workflows/wls-r1-real-windows-mutations.yml"
  pull_request:
    paths:
      - "source/scripts/make_mutation_tasks.py"
      - "source/scripts/verify_r1_mutation_replay.py"
      - "source/tests/test_r1_real_mutation_discovery.py"
      - "source/tests/test_r1_mutation_replay.py"
      - "source/scripts/score_r2_three_try_baselines.py"
      - "source/tests/test_r2_three_try_baselines.py"
      - "source/scripts/run_r2_copilot_probe.py"
      - "source/tests/test_r2_copilot_probe.py"
      - ".github/workflows/wls-r1-real-windows-mutations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wls-r1-observed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-mutants:
    name: Windows real isolated pytest mutation trials
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      WLS_RSI_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup Python 3.13 on hosted Windows
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install canonical WLS and pytest
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual single-line mutation and real isolated pytest controls
        shell: pwsh
        run: |
          python -m pytest -q source/tests/test_r1_real_mutation_discovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Probe real public WLS mutants three times on Windows
        shell: pwsh
        run: |
          python source/scripts/make_mutation_tasks.py --repo . --probes 60 --minimum 5 --timeout 35 --output "r1-real-mutation-receipt.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently replay each observed mutation with three NEW pytest processes
        shell: pwsh
        run: |
          python source/scripts/verify_r1_mutation_replay.py --repo . --receipt "r1-real-mutation-receipt.json" --output "r1-real-mutation-replay.json" --minimum-stable 5 --timeout 35
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Score a fixed seeded sample of genuine 3-test repair attempts
        shell: pwsh
        run: |
          python -m pytest -q source/tests/test_r2_three_try_baselines.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/scripts/score_r2_three_try_baselines.py --repo . --receipt "r1-real-mutation-receipt.json" --replay "r1-real-mutation-replay.json" --sample 8 --timeout 35 --output "r2-public-three-try-baselines.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain bounded public task-level evidence even when blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-r1-real-windows-mutations
          path: |
            r1-real-mutation-receipt.json
            r1-real-mutation-replay.json
            r2-public-three-try-baselines.json
          retention-days: 30
          if-no-files-found: warn

  copilot-public-probe:
    name: One Copilot model call against R2 public 3-test controls
    needs: real-mutants
    # Never spend Copilot credits for untrusted fork PRs or scheduled loops.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      WLS_RSI_API_KEY: ''
      GH_TOKEN: ''
    steps:
      - name: Checkout exact trusted main with no saved token
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install Python 3.13 on disposable hosted Windows
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install canonical trusted scorer dependencies
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reject forged model rankings and false test-green promotions
        shell: pwsh
        run: |
          python -m pytest -q source/tests/test_r2_copilot_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Recover SAME run's independently replayed R1 and R2 baselines
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wls-r1-real-windows-mutations
          path: .
      - name: Prepare oracle-free public model request from the exact frozen sample
        shell: pwsh
        run: |
          python source/scripts/run_r2_copilot_probe.py --mode prepare --repo .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install supported GitHub Copilot CLI
        shell: pwsh
        run: |
          npm install -g @github/copilot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bounded GitHub Copilot Free-seat model trial, no tools or repo access
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: gpt-5-mini
        run: |
          $prompt = Get-Content -Raw -Path r2-copilot-prompt.txt
          Push-Location $env:RUNNER_TEMP
          try {
            & copilot -p "$prompt" --silent --model=gpt-5-mini --no-custom-instructions --disable-builtin-mcps --no-ask-user --deny-tool="read,shell,write,url" > "$env:GITHUB_WORKSPACE/r2-copilot-response.txt"
            if ($LASTEXITCODE -ne 0) { throw "GitHub Copilot returned nonzero, MODEL_NOT_AVAILABLE" }
          }
          finally { Pop-Location }
      - name: Trusted scorer grades model ranking under same real 3-pytest budget
        shell: pwsh
        run: |
          python source/scripts/run_r2_copilot_probe.py --mode score --repo .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve verifiable non-private public development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-r2-copilot-public-development
          path: |
            r2-copilot-taskpack.json
            r2-copilot-report.json
          retention-days: 30
          if-no-files-found: warn
