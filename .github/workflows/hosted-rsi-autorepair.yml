name: WLS GitHub RSI Source Repair

on:
  pull_request:
    paths:
      - "source/scripts/github_rsi_autorepair.py"
      - ".github/workflows/hosted-rsi-autorepair.yml"
      - "source/scripts/build_capability_inventory.py"
      - "source/scripts/build_delivery_handoff.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-rsi-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Mutate WLS source and independently grade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      eligible: ${{ steps.mutate.outputs.eligible }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install deterministic source repair and independent grader
        run: python -m pip install -e ".[dev]"
      - name: RSI iteration: apply limited repair, compare defects, run complete WLS tests
        id: mutate
        run: python source/scripts/github_rsi_autorepair.py
      - name: Archive candidate source and grader evidence, including failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-rsi-repair-${{ github.run_id }}
          path: |
            rsi-repair-candidate.patch
            rsi-repair-report.json
          if-no-files-found: warn

  # Exact tested bytes are promoted only to an existing trusted feature
  # branch. This separate job NEVER executes model-written or patched Python
  # while holding a repository WRITE token. Main stays untouched.
  persist-tested-candidate:
    needs: candidate
    if: >-
      github.event_name == 'pull_request' &&
      needs.candidate.outputs.eligible == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'feat/rsi-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: github-rsi-repair-${{ github.run_id }}
      - name: Verify candidate identity, lower lint faults, exact file allowlist
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          report = json.loads(Path('rsi-repair-report.json').read_text(encoding='utf-8'))
          raw = Path('rsi-repair-candidate.patch').read_bytes()
          assert report['schema'] == 'wls.github_rsi_autorepair.v1'
          assert report['eligible'] is True
          assert report['base_sha'] == os.environ['BASE_SHA']
          assert hashlib.sha256(raw).hexdigest() == report['patch_sha256']
          assert report['gain'] > 0
          frozen = {
              'source/scripts/build_capability_inventory.py',
              'source/scripts/build_delivery_handoff.py',
          }
          assert set(report['changed_files']) <= frozen
          assert report['changed_files']
          assert report['test_exit_code'] == 0
          subprocess.run(['git', 'apply', '--check', 'rsi-repair-candidate.patch'], check=True)
          subprocess.run(['git', 'apply', 'rsi-repair-candidate.patch'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(report['changed_files'])
          print('Verified tested candidate, strictly improved, exact allowlist')
          PY
      - name: Persist self-repair as feature-branch candidate, never main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source/scripts/build_capability_inventory.py source/scripts/build_delivery_handoff.py
          git commit -m "RSI: retain independently graded WLS source repair"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
