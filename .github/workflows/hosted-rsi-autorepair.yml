name: WLS Hosted Mechanical Source Repair Evidence

on:
  # Do not run full-source autonomous repair on every PR commit.
  # That consumed full-test runner minutes and could write back into an
  # actively edited review branch. PRs use the separate deterministic CI.
  workflow_dispatch:
    inputs:
      retain_candidate:
        description: "Explicit manual approval to retain a tested patch on a feature branch"
        type: boolean
        default: false
        required: true
  # Exercise changes to this workflow once; do not run on every source push.
  push:
    branches: [main]
    paths:
      - ".github/workflows/hosted-rsi-autorepair.yml"
  # Bounded weekly mechanical fixes, evidence-only on the mainline.
  schedule:
    - cron: "37 3 * * 6"

permissions:
  contents: read

concurrency:
  group: github-rsi-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Mutate WLS source and independently grade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      eligible: ${{ steps.mutate.outputs.eligible }}
      base_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Pin canonical trusted main snapshot without deleted-branch inheritance
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid exact trusted event SHA" >&2
            exit 2
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install deterministic source repair and independent grader
        run: python -m pip install -e ".[dev]"
      - name: "RSI iteration: apply limited repair, compare defects, run complete WLS tests"
        id: mutate
        run: python source/scripts/github_rsi_autorepair.py
      - name: Archive candidate source and grader evidence, including failed tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-rsi-repair-${{ github.run_id }}
          path: |
            rsi-repair-candidate.patch
            rsi-repair-report.json
          if-no-files-found: warn

  # NEVER create branches on the scheduled/automatic path.
  # Manual, explicit retain_candidate consent is required for any write.
  # This job checks tested bytes without executing patched Python with a token.
  persist-tested-candidate:
    needs: candidate
    if: >-
      needs.candidate.outputs.eligible == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.retain_candidate == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_EVENT: ${{ github.event_name }}
      HEAD_BRANCH: feat/rsi-autonomous-improvement
      BASE_SHA: ${{ needs.candidate.outputs.base_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.candidate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-rsi-repair-${{ github.run_id }}
      - name: Verify candidate identity, lower lint faults, exact file allowlist
        shell: bash
        run: |
          python -I -S - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          report = json.loads(Path('rsi-repair-report.json').read_text(encoding='utf-8'))
          raw = Path('rsi-repair-candidate.patch').read_bytes()
          # Independent write-token job must recheck size; do not trust a
          # model-produced patch or the candidate runner's acceptance alone.
          assert 0 < len(raw) <= 128_000
          assert report['schema'] == 'wls.github_rsi_autorepair.v1'
          assert report['eligible'] is True
          assert report['base_sha'] == os.environ['BASE_SHA']
          assert hashlib.sha256(raw).hexdigest() == report['patch_sha256']
          assert report['gain'] > 0
          scope = report['scope']
          changed = report['changed_files']
          assert isinstance(scope, list) and 1 <= len(scope) <= 2
          assert isinstance(changed, list) and 1 <= len(changed) <= 2
          assert set(changed) <= set(scope)
          blocked = {
              'source/scripts/github_rsi_autorepair.py',
              'source/scripts/verify_rsi_evaluator_change_boundary.py',
              'source/scripts/github_rsi_local_model.py',
              'source/scripts/github_rsi_replay_model.py',
              'source/src/wls/evidence.py',
              'source/src/wls/db.py',
              'source/src/wls/rsi_artifact_gate.py',
              'source/src/wls/benchmark.py',
              'source/src/wls/evaluator.py',
              'source/src/wls/experiment_decision.py',
              'source/src/wls/rsi_evolution.py',
              'source/src/wls/schemas.py',
              'source/scripts/generate_ci_feedback.py',
              'source/src/wls/task_admission.py',
              'source/scripts/run_external_risk_holdout.py',
              'source/scripts/make_mutation_tasks.py',
              'source/scripts/verify_r1_mutation_replay.py',
              'source/scripts/score_r2_three_try_baselines.py',
              'source/scripts/freeze_r1_public_taskpack.py',
              '.github/workflows/wls-r1-real-windows-mutations.yml',
          }
          for name in scope:
              assert isinstance(name, str) and name.endswith('.py')
              assert name not in blocked
              assert name.startswith('source/scripts/') or name.startswith('source/src/wls/')
              assert all(piece not in {'.', '..', ''} for piece in name.split('/'))
              assert Path(name).is_file() and not Path(name).is_symlink()
          assert report['changed_files']
          assert report['test_exit_code'] == 0
          subprocess.run(['git', 'apply', '--check', 'rsi-repair-candidate.patch'], check=True)
          subprocess.run(['git', 'apply', 'rsi-repair-candidate.patch'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(report['changed_files'])
          print('Verified tested candidate, strictly improved, exact allowlist')
          PY
      - name: Persist self-repair as feature-branch candidate, never main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -I -S - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          report = json.loads(Path('rsi-repair-report.json').read_text(encoding='utf-8'))
          subprocess.run(['git', 'add', '--', *report['changed_files']], check=True)
          PY
          git commit -m "RSI: retain independently graded WLS source repair"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"

      - name: Open or update one approved candidate PR only on manual retention
        if: github.event_name == 'workflow_dispatch' && inputs.retain_candidate == true
        shell: bash
        run: |
          count="$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq 'length')"
          if [ "$count" = "0" ]; then
            gh pr create --base main --head "$HEAD_BRANCH" \
              --title "WLS: independently verified ongoing GitHub source improvements" \
              --body "Owner-approved retention of deterministic Ruff repairs, independently tested on a pinned GitHub snapshot. This is mechanical lint cleanup, not model-driven RSI. Nothing modifies main directly."
          fi
          # GitHub-token pushes do not necessarily create normal PR checks.
          # workflow_dispatch is an explicitly supported exception.
          gh workflow run ci.yml --ref "$HEAD_BRANCH"
