name: Audit Full Public Git History for Secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wls-history-secret-audit
  cancel-in-progress: true

jobs:
  scan-history:
    name: Independently scan all reachable Git history (redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every reachable origin branch, tag and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin
          git rev-list --count --all
      - name: Install pinned official gitleaks binary, verify publisher SHA256
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$url" -o /tmp/wls-gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/wls-gitleaks.tar.gz' | sha256sum --check --status
          mkdir -p /tmp/wls-gitleaks
          tar -xzf /tmp/wls-gitleaks.tar.gz -C /tmp/wls-gitleaks gitleaks
          /tmp/wls-gitleaks/gitleaks version
      - name: Scan full Git graph; redact matching credentials in all outputs
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wls-gitleaks/gitleaks git \
            --log-opts="--all" \
            --exit-code=0 \
            --redact=100 \
            --report-format=json \
            --report-path=/tmp/wls-gitleaks-history-redacted.json \
            --no-banner
      - name: Fail on any unreviewed historical credential finding
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = Path("/tmp/wls-gitleaks-history-redacted.json")
          findings = json.loads(report.read_text(encoding="utf-8")) if report.is_file() else []
          # A 2026-07 synthetic security-test literal is deliberately shaped
          # like a token so WLS can verify its own credential redaction.
          # This exception is fixed to ONE rule, source line, and Git commit;
          # actual secret values are never published by this diagnostic.
          known = (
              "generic-api-key",
              "source/tests/test_security.py",
              104,
              "277515d4905e83500ee6d640c103998bbc71e3d9",
          )
          historical = subprocess.check_output(
              ["git", "show", f"{known[3]}:{known[1]}"], text=True
          ).splitlines()
          assert "test_detect_github_token" in historical[102]
          assert "1234567890" in historical[103]  # synthetic sequence, not a live token
          exceptions = 0
          unreviewed = []
          for finding in findings:
              identity = (
                  finding.get("RuleID"),
                  finding.get("File"),
                  finding.get("StartLine"),
                  finding.get("Commit"),
              )
              if identity == known:
                  exceptions += 1
              else:
                  unreviewed.append(identity)
          print(f"historical synthetic fixtures={exceptions}; unreviewed findings={len(unreviewed)}")
          for rule, file, line, commit in unreviewed:
              print(f"UNREVIEWED rule={rule} file={file} line={line} commit={commit}")
          if exceptions > 1 or unreviewed:
              raise SystemExit(1)
          PY
      - name: Print safe finding identifiers (never leak token values)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/wls-gitleaks-history-redacted.json
          if [ -s "$report" ]; then
            jq -r '.[] | [.RuleID, .File, (.StartLine | tostring), .Commit] | @tsv' "$report"
          else
            echo "No redacted findings file emitted."
          fi
      - name: Preserve redacted findings for owner review
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-redacted-history-alerts-${{ github.run_id }}
          path: /tmp/wls-gitleaks-history-redacted.json
          retention-days: 7
          if-no-files-found: warn
