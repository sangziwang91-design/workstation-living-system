name: round001-experiment-schema

on:
  push:
    branches:
      - round/001-reproducible-baseline
    paths:
      - tools/apply_round001_experiment_schema.py
      - .github/workflows/round001-experiment-schema.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round/001-reproducible-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact schema migration
        run: python tools/apply_round001_experiment_schema.py
      - name: Verify migrated source
        run: |
          python -m pip install -e './source[dev]'
          python -m compileall -q source/src
          python -m pytest source/tests -q
          python -m ruff check source/src source/tests
          python -m mypy source/src
          python -m bandit -q -r source/src
      - name: Remove one-time migration machinery
        run: |
          rm tools/apply_round001_experiment_schema.py
          rm .github/workflows/round001-experiment-schema.yml
      - name: Commit migrated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/src/wls/db.py tools/apply_round001_experiment_schema.py .github/workflows/round001-experiment-schema.yml
          git commit -m 'round-001: add durable experiment result tables'
          git push origin HEAD:round/001-reproducible-baseline
