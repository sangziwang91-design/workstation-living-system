name: Verify EVOLUTION-TARGET-003

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "source/**"
      - "docs/EVOLUTION_TARGET_003.md"
      - "CURRENT_STATE.yaml"
      - "LIVING_SYSTEM_GENOME.md"
      - "README.md"
      - ".github/workflows/verify-evolution-target-003.yml"
      - ".github/scripts/prepare-windows-runner.ps1"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "source/**"
      - "docs/EVOLUTION_TARGET_003.md"
      - "CURRENT_STATE.yaml"
      - "LIVING_SYSTEM_GENOME.md"
      - "README.md"
      - ".github/workflows/verify-evolution-target-003.yml"
      - ".github/scripts/prepare-windows-runner.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-target-003-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: D:\actions-runner\_cache\pip
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TEMP: D:\actions-runner\_temp
  TMP: D:\actions-runner\_temp

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare isolated local Python
        shell: powershell
        run: .\.github\scripts\prepare-windows-runner.ps1 -PythonVersion "${{ matrix.python-version }}"
      - name: Install WLS and verification toolchain from root
        shell: powershell
        run: 'python -m pip install --retries 10 --timeout 120 -e ".[dev]"'
      - name: Verify repository layout
        shell: powershell
        run: 'python source/scripts/verify_packaging_layout.py'
      - name: Compile
        shell: powershell
        run: 'python -m compileall -q source/src source/tests source/scripts'
      - name: Tests
        shell: powershell
        run: 'python -m pytest source/tests -q'
      - name: Verify target 001
        shell: powershell
        run: 'python source/scripts/verify_evolution_target_001.py'
      - name: Verify target 002
        shell: powershell
        run: 'python source/scripts/verify_evolution_target_002.py'
      - name: Verify target 003
        shell: powershell
        run: 'python source/scripts/verify_evolution_target_003.py'
      - name: Lint
        shell: powershell
        run: 'python -m ruff check source/src source/tests source/scripts'
      - name: Types
        shell: powershell
        run: 'python -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports'
      - name: Bandit
        shell: powershell
        run: 'python -m bandit -q -r source/src/wls source/scripts'
      - name: Build package
        shell: powershell
        run: 'python -m build .'
