name: Verify Repository Invariants

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-invariants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce one project root, package root, version authority, and bounded CI topology
        run: python source/scripts/verify_packaging_layout.py

  pr-root-smoke:
    if: github.event_name == 'pull_request'
    needs: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install from the sole project root
        run: python -m pip install -e ".[dev]"
      - name: Verify installed and source versions are identical
        run: python -c "from importlib.metadata import version; from wls._version import __version__; assert version('workstation-living-system') == __version__"
      - name: Smoke-test both entry points
        run: wls --help && python -m wls --help
      - name: Verify imported package location
        run: python -c "from pathlib import Path; import wls; assert 'source/src/wls' in Path(wls.__file__).resolve().as_posix()"

  main-root-matrix:
    if: github.event_name != 'pull_request'
    needs: invariants
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from the sole project root
        run: python -m pip install -e ".[dev]"
      - name: Verify installed and source versions are identical
        run: python -c "from importlib.metadata import version; from wls._version import __version__; assert version('workstation-living-system') == __version__"
      - name: Smoke-test console entry point
        run: wls --help
      - name: Smoke-test module entry point
        run: python -m wls --help
      - name: Verify imported package location
        run: python -c "from pathlib import Path; import wls; assert 'source/src/wls' in Path(wls.__file__).resolve().as_posix()"
      - name: Run focused repository-invariant test
        run: python -m pytest source/tests/test_packaging_layout.py -q
      - name: Build canonical wheel
        run: python -m build --wheel --outdir dist-root .
