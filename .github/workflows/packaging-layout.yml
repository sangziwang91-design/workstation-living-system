name: Verify Repository Invariants

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-invariants-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: D:\actions-runner\_cache\pip
  TEMP: D:\actions-runner\_temp
  TMP: D:\actions-runner\_temp

jobs:
  invariants:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Prepare D-drive runtime directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:PIP_CACHE_DIR | Out-Null
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Enforce one project root, one package root, and one version authority
        run: python source/scripts/verify_packaging_layout.py

  root-install:
    needs: invariants
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Prepare D-drive runtime directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:PIP_CACHE_DIR | Out-Null
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install from the sole repository project root
        run: python -m pip install -e ".[dev]"
      - name: Verify installed and source versions are identical
        run: python -c "from importlib.metadata import version; from wls._version import __version__; print(version('workstation-living-system'), __version__); assert version('workstation-living-system') == __version__"
      - name: Smoke test console entry point
        run: wls --help
      - name: Smoke test module entry point
        run: python -m wls --help
      - name: Verify imported package location
        run: python -c "from pathlib import Path; import wls; path=Path(wls.__file__).resolve(); print(path); assert 'source/src/wls' in path.as_posix()"
      - name: Run focused repository-invariant test
        run: python -m pytest source/tests/test_packaging_layout.py -q
      - name: Build canonical wheel
        run: python -m build --wheel --outdir dist-root .
