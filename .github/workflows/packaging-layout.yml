name: Verify Repository Invariants

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-invariants-${{ github.ref }}
  cancel-in-progress: true


jobs:
  invariants:
    name: GitHub-hosted packaging and installed entrypoints
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install actual WLS package
        run: python -m pip install -e ".[dev]"
      - name: Validate canonical repository structure
        run: python source/scripts/verify_packaging_layout.py
      - name: Test actual installed package and console entrypoint
        run: |
          python -m pytest -q source/tests/test_packaging_layout.py --junitxml=packaging.xml
          python -m wls --help
          wls --help
      - name: Build installable wheel
        run: python -m build --wheel --outdir dist-root .
      - name: Archive cross-platform install and wheel proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-packaging-${{ matrix.os }}-${{ github.run_id }}
          path: |
            packaging.xml
            dist-root/
          if-no-files-found: warn
