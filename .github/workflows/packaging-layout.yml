name: Verify Repository Invariants

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Enforce one project root, one package root, and one version authority
        run: python source/scripts/verify_packaging_layout.py

  root-install:
    needs: invariants
    env:
      PIP_CACHE_DIR: D:\actions-runner\_cache\pip
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_RETRIES: "10"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TEMP: D:\actions-runner\_temp
      TMP: D:\actions-runner\_temp
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Prepare D-drive runtime directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:PIP_CACHE_DIR | Out-Null
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare isolated local Python
        shell: powershell
        run: .\.github\scripts\prepare-windows-runner.ps1 -PythonVersion "${{ matrix.python-version }}"
      - name: Install from the sole repository project root
        shell: powershell
        run: '& $env:PYTHON_EXE -m pip install --retries 10 --timeout 120 -e ".[dev]"'
      - name: Verify installed and source versions are identical
        shell: powershell
        run: '& $env:PYTHON_EXE -c "from importlib.metadata import version; from wls._version import __version__; print(version(''workstation-living-system''), __version__); assert version(''workstation-living-system'') == __version__"'
      - name: Smoke test console entry point
        shell: powershell
        run: '& "$env:PYTHON_ROOT\Scripts\wls.exe" --help'
      - name: Smoke test module entry point
        shell: powershell
        run: '& $env:PYTHON_EXE -m wls --help'
      - name: Verify imported package location
        shell: powershell
        run: '& $env:PYTHON_EXE -c "from pathlib import Path; import wls; path=Path(wls.__file__).resolve(); print(path); assert ''source/src/wls'' in path.as_posix()"'
      - name: Run focused repository-invariant test
        shell: powershell
        run: '& $env:PYTHON_EXE -m pytest source/tests/test_packaging_layout.py -q'
      - name: Build canonical wheel
        shell: powershell
        run: '& $env:PYTHON_EXE -m build --wheel --outdir dist-root .'
