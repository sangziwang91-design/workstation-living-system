name: Verify EVOLUTION-TARGET-002

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "source/**"
      - "CURRENT_STATE.yaml"
      - "README.md"
      - ".github/workflows/build-evolution-target-002.yml"
      - ".github/scripts/prepare-windows-runner.ps1"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "source/**"
      - "CURRENT_STATE.yaml"
      - "README.md"
      - ".github/workflows/build-evolution-target-002.yml"
      - ".github/scripts/prepare-windows-runner.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-target-002-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: D:\actions-runner\_cache\pip
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TEMP: D:\actions-runner\_temp
  TMP: D:\actions-runner\_temp

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Prepare D-drive runtime directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:PIP_CACHE_DIR | Out-Null
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare isolated local Python
        shell: powershell
        run: .\.github\scripts\prepare-windows-runner.ps1 -PythonVersion "3.13"
      - name: Install WLS and verification toolchain from root
        shell: powershell
        run: '& $env:PYTHON_EXE -m pip install --retries 10 --timeout 120 -e ".[dev]"'
      - name: Verify repository layout
        shell: powershell
        run: '& $env:PYTHON_EXE source/scripts/verify_packaging_layout.py'
      - name: Compile
        shell: powershell
        run: '& $env:PYTHON_EXE -m compileall -q source/src source/tests source/scripts'
      - name: Tests
        shell: powershell
        run: '& $env:PYTHON_EXE -m pytest source/tests -q'
      - name: Vertical verification
        shell: powershell
        run: '& $env:PYTHON_EXE source/scripts/verify_evolution_target_002.py'
      - name: Lint
        shell: powershell
        run: '& $env:PYTHON_EXE -m ruff check source/src source/tests source/scripts'
      - name: Types
        shell: powershell
        run: '& $env:PYTHON_EXE -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports'
      - name: Bandit
        shell: powershell
        run: '& $env:PYTHON_EXE -m bandit -q -r source/src/wls source/scripts'
      - name: Build package
        shell: powershell
        run: '& $env:PYTHON_EXE -m build .'
