name: Verify EVOLUTION-TARGET-002

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "source/**"
      - "CURRENT_STATE.yaml"
      - "README.md"
      - ".github/workflows/build-evolution-target-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install WLS and verification toolchain from root
        run: python -m pip install -e ".[dev]"
      - name: Verify repository layout
        run: python source/scripts/verify_packaging_layout.py
      - name: Compile
        run: python -m compileall -q source/src source/tests source/scripts
      - name: Tests
        run: python -m pytest source/tests -q
      - name: Vertical verification
        run: python source/scripts/verify_evolution_target_002.py
      - name: Lint
        run: python -m ruff check source/src source/tests source/scripts
      - name: Types
        run: python -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports
      - name: Security scan
        run: python -m bandit -q -r source/src/wls source/scripts
      - name: Build package
        run: python -m build .
