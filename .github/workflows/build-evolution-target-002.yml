name: Verify EVOLUTION-TARGET-002

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "source/**"
      - "CURRENT_STATE.yaml"
      - "README.md"
      - ".github/workflows/build-evolution-target-002.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-target-002-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: D:\actions-runner\_cache\pip
  TEMP: D:\actions-runner\_temp
  TMP: D:\actions-runner\_temp

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Prepare D-drive runtime directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:PIP_CACHE_DIR | Out-Null
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Expose 7-Zip for setup-python
        shell: powershell
        run: |
          $candidates = @(
            "D:\Tools\7-Zip\7z.exe",
            "C:\Program Files\7-Zip\7z.exe",
            "E:\git\usr\bin\7z.exe",
            "E:\git\mingw64\bin\7z.exe",
            "C:\Program Files\Git\usr\bin\7z.exe",
            "C:\Program Files\Git\mingw64\bin\7z.exe"
          )
          $existing = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($existing) {
            $sevenZip = $existing.Source
          } else {
            $sevenZip = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $sevenZip) {
            throw "7-Zip is required by setup-python on Windows self-hosted runners but was not found."
          }
          $sevenZipDir = Split-Path $sevenZip -Parent
          $sevenZipDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $sevenZip i | Select-Object -First 20
          Write-Host "Using 7-Zip: $sevenZip"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Install WLS and verification toolchain from root
        run: python -m pip install -e ".[dev]"
      - name: Verify repository layout
        run: python source/scripts/verify_packaging_layout.py
      - name: Compile
        run: python -m compileall -q source/src source/tests source/scripts
      - name: Tests
        run: python -m pytest source/tests -q
      - name: Vertical verification
        run: python source/scripts/verify_evolution_target_002.py
      - name: Lint
        run: python -m ruff check source/src source/tests source/scripts
      - name: Types
        run: python -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports
      - name: Bandit
        run: python -m bandit -q -r source/src/wls source/scripts
      - name: Build package
        run: python -m build .
