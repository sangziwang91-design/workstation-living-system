name: Build EVOLUTION-TARGET-002

on:
  push:
    branches: [evolution-target-002-local-cognition]
    paths:
      - ".github/workflows/build-evolution-target-002.yml"
  pull_request:
    paths:
      - "source/**"
      - "CURRENT_STATE.yaml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply bounded local cognition target
        run: python source/scripts/apply_evolution_target_002.py
      - name: Apply targeted typing repair
        run: python source/scripts/fix_evolution_target_002.py
      - name: Install verification toolchain
        run: python -m pip install --upgrade pip build pytest ruff mypy bandit
      - name: Install WLS editable
        run: python -m pip install -e "source[dev]"
      - name: Compile
        run: python -m compileall -q source/src source/tests source/scripts
      - name: Tests
        run: python -m pytest source/tests -q
      - name: Vertical verification
        run: python source/scripts/verify_evolution_target_002.py --output source/verification/EVOLUTION_TARGET_002_CI.json
      - name: Lint
        run: python -m ruff check source/src source/tests source/scripts
      - name: Pack patched source for diagnostics
        shell: bash
        run: tar -czf evolution-target-002-source.tar.gz source README.md CURRENT_STATE.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: evolution-target-002-patched-source
          path: evolution-target-002-source.tar.gz
          if-no-files-found: error
      - name: Types
        run: python -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports
      - name: Security scan
        run: python -m bandit -q -r source/src/wls source/scripts
      - name: Build package
        run: python -m build source
      - name: Create verified patch artifact
        shell: bash
        run: |
          set -euo pipefail
          find source -type d -name __pycache__ -prune -exec rm -rf {} +
          find source -type f -name '*.pyc' -delete
          rm -rf source/dist source/build source/src/*.egg-info
          git add -N .
          git diff --binary > evolution-target-002.patch
      - uses: actions/upload-artifact@v4
        with:
          name: evolution-target-002-verified-patch
          path: evolution-target-002.patch
          if-no-files-found: error
