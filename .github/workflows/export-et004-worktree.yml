name: Export ET004 worktree

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-et004-worktree.yml"
      - "source/**"
      - "docs/**"
      - "CURRENT_STATE.yaml"
      - "README.md"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package worktree
        shell: bash
        run: |
          tar --exclude=.git -czf /tmp/wls-et004-worktree.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: wls-et004-worktree
          path: /tmp/wls-et004-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
