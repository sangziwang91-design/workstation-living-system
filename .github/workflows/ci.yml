name: WLS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: wls-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install verification tools from the sole project root
        shell: powershell
        run: |
          python -m pip install --retries 10 --timeout 120 -e ".[dev]"
      - name: Verify repository layout and version authority
        shell: powershell
        run: 'python source/scripts/verify_packaging_layout.py'
      - name: Compile
        shell: powershell
        run: 'python -m compileall -q source/src source/tests source/scripts'
      - name: Tests
        shell: powershell
        run: 'python -m pytest source/tests -q'
      - name: Blocking lint correctness gate
        shell: powershell
        run: 'python -m ruff check source/src source/tests source/scripts --select E9,F63,F7,F82'
      - name: Full lint debt audit
        continue-on-error: true
        shell: powershell
        run: 'python -m ruff check source/src source/tests source/scripts'
      - name: Types
        shell: powershell
        run: 'python -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports'
      - name: Security scan
        shell: powershell
        run: 'python -m bandit -q -r source/src/wls source/scripts'
      - name: Build package
        shell: powershell
        run: 'python -m build .'
