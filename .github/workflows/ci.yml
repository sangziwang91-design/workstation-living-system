name: WLS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verification tools
        run: python -m pip install -e . pytest ruff mypy bandit
      - name: Compile
        run: python -m compileall -q src
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests
      - name: Types
        run: python -m mypy src/wls tests --ignore-missing-imports
      - name: Security scan
        run: python -m bandit -q -r src/wls
