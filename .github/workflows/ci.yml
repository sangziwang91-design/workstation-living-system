name: WLS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wls-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary PR check runs entirely on GitHub-hosted infrastructure.
  # It needs neither the owner's Windows PC nor the offline self-hosted runner.
  github-hosted-full-validation:
    name: Hosted full WLS tests and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_CACHE_DIR: /tmp/wls-pip-cache
      TEMP: /tmp
      TMP: /tmp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install WLS and verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Enforce canonical packaging root
        run: python source/scripts/verify_packaging_layout.py
      - name: Compile source, tests, and executable checks
        run: python -m compileall -q source/src source/tests source/scripts
      - name: Run complete test suite with inspectable result XML
        run: python -m pytest -q source/tests --maxfail=1 --junitxml=hosted-full-pytest.xml
      - name: Verify shipped WLS evolution targets
        run: |
          python source/scripts/verify_evolution_target_001.py
          python source/scripts/verify_evolution_target_002.py
          python source/scripts/verify_evolution_target_003.py
      # Historical full-tree lint has 300 pre-existing violations.
      # Keep its machine-readable evidence; strict fail-closed gate only on
      # changed RSI and bridge/runtime surfaces. No 300-file cosmetic churn.
      - name: Archive historical full-source lint debt
        if: always()
        shell: bash
        run: |
          python -m ruff check source/src source/tests source/scripts --output-format json > hosted-ruff-debt.json || true
      - name: Lint changed coding and RSI surfaces
        run: |
          python -m ruff check source/src/wls/coding_adapter.py source/src/wls/rsi_evolution.py source/src/wls/rsi_artifact_gate.py source/src/wls/rsi_model_port.py source/tests/test_coding_adapter_cross_platform.py source/tests/test_agentbridge_full_roundtrip.py source/tests/test_agentbridge_handoff.py
      - name: Type-check coding adapter and model RSI boundary
        run: python -m mypy source/src/wls/coding_adapter.py source/src/wls/rsi_model_port.py --ignore-missing-imports
      - name: Scan modified WLS coding and model-adapter boundary
        run: python -m bandit -q source/src/wls/coding_adapter.py source/src/wls/rsi_model_port.py
      - name: Build installable wheel and sdist
        run: python -m build .
      - name: Save complete hosted evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-full-wls-${{ github.run_id }}
          path: |
            hosted-full-pytest.xml
            hosted-ruff-debt.json
            dist/
          if-no-files-found: warn

  # Public WLS also verifies the COMPLETE package under Windows, not only
  # packaging and targeted RSI smoke. Never use the owner's offline PC.
  github-hosted-windows-full-validation:
    name: Hosted Windows full WLS Python ${{ matrix.python-version }} and wheel
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Configure hosted Windows temporary directories
        shell: pwsh
        run: |
          "PIP_CACHE_DIR=$env:RUNNER_TEMP\\wls-pip-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual WLS package and verification tools
        run: python -m pip install -e ".[dev]"
      - name: Verify canonical packaging structure and compile
        run: |
          python source/scripts/verify_packaging_layout.py
          python -m compileall -q source/src source/tests source/scripts
      - name: Run the entire Windows suite with inspectable result XML
        run: python -m pytest -q source/tests --maxfail=1 --junitxml=hosted-windows-full.xml
      - name: Lint and type-check held model and coding trust boundary
        run: |
          python -m ruff check source/src/wls/coding_adapter.py source/src/wls/rsi_evolution.py source/src/wls/rsi_artifact_gate.py source/src/wls/rsi_model_port.py
          python -m mypy source/src/wls/coding_adapter.py source/src/wls/rsi_model_port.py --ignore-missing-imports
          python -m bandit -q source/src/wls/coding_adapter.py source/src/wls/rsi_model_port.py
      - name: Build installable Windows wheel
        run: python -m build --wheel --outdir dist-windows .
      - name: Preserve Windows full-suite outcome and wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-windows-full-wls-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            hosted-windows-full.xml
            dist-windows/
          if-no-files-found: warn

  # Produces observed CI feedback even when earlier jobs failed. This is
  # advisory, non-authoritative, and contains NO private Nuomi holdout tasks.
  ci-feedback:
    name: Generate WLS FEEDBACK and Derived State
    if: always()
    needs: [github-hosted-full-validation, github-hosted-windows-full-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout read-only candidate snapshot
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Configure Python for feedback extraction
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Collect all available hosted test XML artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: hosted-*-${{ github.run_id }}
          path: ci-evidence
          merge-multiple: false
      - name: Generate FEEDBACK.json and derived CURRENT_STATE.yaml
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -e . PyYAML
          python source/scripts/generate_ci_feedback.py \
            --repo . --evidence ci-evidence --output ci-feedback
      - name: Publish inspectable feedback including unsuccessful checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wls-feedback-${{ github.run_id }}
          path: |
            ci-feedback/FEEDBACK.json
            ci-feedback/CURRENT_STATE.yaml
          if-no-files-found: error
