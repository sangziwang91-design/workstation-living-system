name: verify

on:
  push:
    branches: [main, "round/**"]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source and development checks
        run: python -m pip install -e "./source[dev]"
      - name: Unit and adversarial tests
        run: python -m pytest source/tests --cov=wls --cov-branch --cov-report=term-missing
      - name: Ruff
        run: python -m ruff check source/src source/tests
      - name: Mypy
        run: python -m mypy source/src
      - name: Bandit
        run: python -m bandit -q -r source/src

  release-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify bundled release without repository metadata
        run: python VERIFY_RELEASE.py
