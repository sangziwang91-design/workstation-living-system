name: WLS CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  recover-et004-on-latest-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PATCH_SHA256: "81bcb40abeae266595dab1dc9dadf218a6c6a6a328cbd27acf6b5fb4f58f6ea5"
      GOAL_RUNTIME_BLOB: "ad80194dcb1603b064f253504e710b77e8a68724"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution-target-004-persistent-goals
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reconstruct verified ET004 patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          shas = [
              "e291d995ffae8bcf33b5eb50dd9029e6d960079f",
              "5e6ddb4a52c284129b436d5b6f8addc2c8e719c0",
              "b4bff92c5c51f1380a0b4e1f2496d5e8cc42b31b",
              "47bb8bd4c2aff682fe638af3a073265b2185b161",
              "06b2e4b70c6a83ed4a057d72b42b98bfb86c7523",
              "19b66e6f62f5ebb9bfd4e92d7b438dab4a7eec3b",
              "2dd3db1bcad4507e33b0823fa3a0613fa8a8cc4c",
              "95fa8b373e1553f496eedc13bd294a9f6a4c246e",
              "af5b187df04ceac36f475abca0e08aa9e3e53026",
              "f8892555358d560b270c6b083666f3974490bd85",
              "a30ca924b5fcee17c26141a02490083f5f7299bc",
          ]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          def fetch_blob(sha: str) -> bytes:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              return base64.b64decode(payload["content"])

          target = Path("/tmp/et004.patch.gz.b64")
          with target.open("wb") as output:
              for sha in shas:
                  output.write(fetch_blob(sha))
          Path("source/src/wls/goal_runtime.py").write_bytes(
              fetch_blob(os.environ["GOAL_RUNTIME_BLOB"])
          )
          PY
          base64 -d /tmp/et004.patch.gz.b64 > /tmp/et004.patch.gz
          echo "${PATCH_SHA256}  /tmp/et004.patch.gz" | sha256sum --check --strict
          gunzip -c /tmp/et004.patch.gz > /tmp/et004.patch
          git apply --check \
            --exclude=source/src/wls/goal_runtime.py \
            --exclude=.github/workflows/verify-evolution-target-004.yml \
            /tmp/et004.patch
          git apply \
            --exclude=source/src/wls/goal_runtime.py \
            --exclude=.github/workflows/verify-evolution-target-004.yml \
            /tmp/et004.patch
      - name: Install verification toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest ruff mypy bandit PyYAML
          python -m pip install -e "source[dev]"
      - name: Compile
        run: python -m compileall -q source/src source/tests source/scripts
      - name: Test full suite
        run: python -m pytest source/tests -q
      - name: Validate repo-native evolution chain
        run: python source/scripts/validate_evolution_chain.py
      - name: Verify ET001
        run: python source/scripts/verify_evolution_target_001.py
      - name: Verify ET002
        run: python source/scripts/verify_evolution_target_002.py
      - name: Verify ET003
        run: python source/scripts/verify_evolution_target_003.py
      - name: Verify ET004
        run: python source/scripts/verify_evolution_target_004.py --output source/verification/EVOLUTION_TARGET_004_LOCAL_20260624.json
      - name: Lint
        run: python -m ruff check source/src source/tests source/scripts
      - name: Type check
        run: python -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports
      - name: Security scan
        run: python -m bandit -q -r source/src/wls source/scripts
      - name: Validate canonical state
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          state = yaml.safe_load(Path("CURRENT_STATE.yaml").read_text(encoding="utf-8"))
          assert state["schema_version"] == "1.6"
          assert state["system"]["development_version"] == "1.0.0.dev1"
          PY
      - name: Build package
        run: python -m build source
      - name: Commit verified ET004 on latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(et004): integrate persistent goal continuity on latest main"
          git push origin HEAD:evolution-target-004-persistent-goals
