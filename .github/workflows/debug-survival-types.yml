name: Survival Type Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q -e . mypy pytest
      - name: Capture mypy diagnostics
        id: mypy
        continue-on-error: true
        run: |
          python -m mypy src/wls/survival.py src/wls/survival_plugin.py tests/test_survival.py --ignore-missing-imports > mypy-survival.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-survival
          path: source/mypy-survival.txt
      - name: Enforce mypy result
        run: |
          cat mypy-survival.txt
          test "${{ steps.mypy.outputs.exit_code }}" = "0"
