name: Survival Type Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q -e . mypy pytest
      - run: python -m mypy src/wls/survival.py src/wls/survival_plugin.py tests/test_survival.py --ignore-missing-imports
