name: round001-clean-generated

on:
  push:
    branches:
      - round/001-reproducible-baseline
    paths:
      - .github/workflows/round001-clean-generated.yml

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round/001-reproducible-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove only allowlisted generated artifacts
        run: python tools/clean_round001_generated.py
      - name: Verify clean source and release
        run: |
          python -m pip install -e './source[dev]'
          python -m pytest source/tests --cov=wls --cov-branch --cov-fail-under=65
          python -m ruff check source/src source/tests
          python -m mypy source/src
          python -m bandit -q -r source/src
          python VERIFY_RELEASE.py
      - name: Refresh release inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          root = Path('.')
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          lines = []
          for name in sorted(tracked):
              if name == 'SHA256SUMS.txt':
                  continue
              path = root / name
              if not path.is_file():
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{name}")
          Path('SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python VERIFY_RELEASE.py
      - name: Commit clean repository tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'round-001: remove generated artifacts from source control'
          git push origin HEAD:round/001-reproducible-baseline
