name: WLS Final Merged PR Branch Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wls-final-pr-ref-cleanup.yml
      - source/scripts/finalize_merged_pr_refs.py

permissions:
  contents: read

concurrency:
  group: wls-final-pr-ref-cleanup
  cancel-in-progress: false

jobs:
  prune-merged-pr-branches:
    if: github.repository == 'sangziwang91-design/workstation-living-system' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable main and complete Git ancestry
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure trusted Windows Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Delete only merged reviewed PR refs and own branch
        shell: pwsh
        run: |
          python source/scripts/finalize_merged_pr_refs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Store independently checkable branch inventory receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wls-final-merged-pr-ref-cleanup
          path: wls-final-branch-ref-cleanup-receipt.json
          retention-days: 90
          if-no-files-found: warn
