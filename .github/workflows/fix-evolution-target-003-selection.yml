name: Fix EVOLUTION-TARGET-003 selection

on:
  push:
    branches:
      - evolution-target-003-causal-memory
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution-target-003-causal-memory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply minimum selection repair
        run: python .github/fix_et003_selection.py
      - name: Remove temporary diagnostics and repair workflow
        run: rm -f .github/fix_et003_selection.py .github/workflows/fix-evolution-target-003-selection.yml .github/workflows/diagnose-evolution-target-003.yml .github/et003-diagnostic.json .github/et003-test-output.txt
      - name: Install verification toolchain
        run: python -m pip install --upgrade pip build pytest ruff mypy bandit
      - name: Install WLS editable
        run: python -m pip install -e "source[dev]"
      - name: Compile
        run: python -m compileall -q source/src source/tests source/scripts
      - name: Run tests and capture result
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest source/tests -q > .github/et003-repair-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist repair diagnostics on failure
        if: steps.tests.outputs.exit_code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .github/et003-repair-output.txt
          git commit -m "wip(et003): capture selection repair failure"
          git push origin HEAD:evolution-target-003-causal-memory
      - name: Fail on regression
        if: steps.tests.outputs.exit_code != '0'
        run: |
          cat .github/et003-repair-output.txt
          exit 1
      - name: Verify EVOLUTION-TARGET-001
        run: python source/scripts/verify_evolution_target_001.py
      - name: Verify EVOLUTION-TARGET-002
        run: python source/scripts/verify_evolution_target_002.py
      - name: Verify EVOLUTION-TARGET-003 and write evidence
        run: python source/scripts/verify_evolution_target_003.py --output source/verification/EVOLUTION_TARGET_003_LOCAL_20260624.json
      - name: Lint
        run: python -m ruff check source/src source/tests source/scripts
      - name: Types
        run: python -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports
      - name: Security scan
        run: python -m bandit -q -r source/src/wls source/scripts
      - name: Build package
        run: python -m build source
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/et003-repair-output.txt
          git add -A
          git commit -m "fix(et003): make causal memory change bounded decisions"
          git push origin HEAD:evolution-target-003-causal-memory
