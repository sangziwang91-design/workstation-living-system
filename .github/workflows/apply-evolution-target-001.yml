name: Verify EVOLUTION-TARGET-001

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "source/**"
      - "CURRENT_STATE.yaml"
      - "LIVING_SYSTEM_GENOME.md"
      - ".github/workflows/apply-evolution-target-001.yml"
      - ".github/scripts/prepare-windows-runner.ps1"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "source/**"
      - "CURRENT_STATE.yaml"
      - "LIVING_SYSTEM_GENOME.md"
      - ".github/workflows/apply-evolution-target-001.yml"
      - ".github/scripts/prepare-windows-runner.ps1"

permissions:
  contents: read

concurrency:
  group: evolution-target-001-${{ github.ref }}
  cancel-in-progress: true


jobs:
  verify:
    name: GitHub hosted evolution target 001
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Verify packaging and evolution target 001
        run: |
          python source/scripts/verify_packaging_layout.py
          python source/scripts/verify_evolution_target_001.py
      - name: Regression suite for evolution target 001
        run: python -m pytest -q source/tests/test_evolution_target_001.py --junitxml=evolution-target-001.xml
      - name: Preserve independent verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-et001-${{ github.run_id }}
          path: evolution-target-001.xml
          if-no-files-found: warn
