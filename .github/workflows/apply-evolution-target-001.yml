name: Verify EVOLUTION-TARGET-001

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "source/**"
      - "CURRENT_STATE.yaml"
      - "LIVING_SYSTEM_GENOME.md"
      - ".github/workflows/apply-evolution-target-001.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "source/**"
      - "CURRENT_STATE.yaml"
      - "LIVING_SYSTEM_GENOME.md"
      - ".github/workflows/apply-evolution-target-001.yml"

permissions:
  contents: read

concurrency:
  group: evolution-target-001-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install WLS and verification toolchain from root
        shell: powershell
        run: 'python -m pip install --retries 10 --timeout 120 -e ".[dev]"'
      - name: Verify repository layout
        shell: powershell
        run: 'python source/scripts/verify_packaging_layout.py'
      - name: Compile
        shell: powershell
        run: 'python -m compileall -q source/src source/tests source/scripts'
      - name: Verify EVOLUTION-TARGET-001
        shell: powershell
        run: 'python source/scripts/verify_evolution_target_001.py'