name: Finalize EVOLUTION-TARGET-001

on:
  push:
    paths:
      - ".github/workflows/apply-evolution-target-001.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Remove generated artifacts and install ignore rules
        shell: bash
        run: |
          set -euo pipefail
          find source -type d -name __pycache__ -prune -exec rm -rf {} +
          find source -type f -name '*.pyc' -delete
          rm -rf source/dist source/build source/src/*.egg-info
          python - <<'PY'
          from pathlib import Path
          path = Path(".gitignore")
          existing = path.read_text(encoding="utf-8") if path.exists() else ""
          rules = [
              "__pycache__/",
              "*.py[cod]",
              ".pytest_cache/",
              ".mypy_cache/",
              ".ruff_cache/",
              "*.egg-info/",
              "dist/",
              "build/",
              ".venv/",
              ".env",
          ]
          additions = [rule for rule in rules if rule not in existing.splitlines()]
          if additions:
              text = existing.rstrip() + ("\n" if existing.strip() else "")
              text += "\n".join(additions) + "\n"
              path.write_text(text, encoding="utf-8")
          PY

      - name: Install verification toolchain
        run: python -m pip install --upgrade pip build pytest ruff mypy bandit

      - name: Install WLS editable
        run: python -m pip install -e "source[dev]"

      - name: Verify canonical implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q source/src source/tests source/scripts
          python -m pytest source/tests -q
          python source/scripts/verify_evolution_target_001.py
          python -m ruff check source/src source/tests source/scripts
          python -m mypy source/src/wls source/tests source/scripts --ignore-missing-imports
          python -m bandit -q -r source/src/wls source/scripts
          python -m build source

      - name: Clean build products again
        shell: bash
        run: |
          set -euo pipefail
          find source -type d -name __pycache__ -prune -exec rm -rf {} +
          find source -type f -name '*.pyc' -delete
          rm -rf source/dist source/build source/src/*.egg-info

      - name: Commit clean verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: clean verified evolution target artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
